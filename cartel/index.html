const dec = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:dec(B.s), iterations:B.it, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:dec(B.iv)}, key, dec(B.ct));
  return new TextDecoder().decode(pt);
}
// Each page saves its unlock under its OWN key. One shared slot used to let a
// word saved on tool A shadow tool B's gate and, worse, skip the member
// auto-unlock entirely (the cross-tool "Wrong password." bug, 2026-07-17).
const KEY_ID = "bonkcartel";
const SKEY = "eve_k::" + (KEY_ID || location.pathname);
async function tryUnlock(pw, save, quiet) {
  try {
    const html = await decrypt(pw);
    if (save) sessionStorage.setItem(SKEY, pw);
    document.open(); document.write(html); document.close();
    return true;
  } catch (e) {
    sessionStorage.removeItem(SKEY);
    if (!quiet) { const el = document.getElementById("err"); if (el) el.textContent = "Wrong password."; }
    return false;
  }
}
// logged-in members skip the gate: the portal hands back the shared password
// for their session. Falls back to the manual gate when logged out or offline.
function autoUnlock() {
  if (!KEY_ID) return;
  fetch("/api/unlock?k=" + encodeURIComponent(KEY_ID), { credentials: "same-origin" })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ if (d && d.ok && d.key) tryUnlock(d.key, true, true); })
    .catch(function(){});
}
document.getElementById("go").onclick = () => tryUnlock(document.getElementById("pw").value, true);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("go").click(); });
// honor the legacy shared slot once (quiet); wrong word falls through to auto-unlock
const saved = sessionStorage.getItem(SKEY) || sessionStorage.getItem("eve_k");
if (saved) tryUnlock(saved, false, true).then(function(ok){ if (!ok) autoUnlock(); });
else autoUnlock();
