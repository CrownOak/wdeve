<!doctype html>
<html lang="en"><head><meta charset="utf-8"><script src="/i18n.js?v=6"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GOBSEC — the board</title>
<link rel="stylesheet" href="/common.css?v=3">
<style>
  /* THE COMBAT PILOT'S PAGE (GOBSEC-PORTAL-SPEC part one). Five bands, in the order a
     pilot cares. The test: read for eight seconds, know whether to undock and where.
     GOBSEC register: cold, understated, contractions, no poster-speak. */
  :root{ --gs: #ff4757; --gsdim: rgba(255,71,87,.34); }
  .gw{ max-width:960px; margin:0 auto; padding:20px 18px 70px; }
  .ghead{ display:flex; align-items:center; gap:14px; margin:4px 0 6px; }
  .ghead img{ width:52px; height:52px; }
  .ghead h1{ font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:.14em;
             font-size:19px; color:var(--silver); margin:0; }
  .ghead .sub{ font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
               color:var(--muted); margin-top:4px; }
  .gate{ background:var(--steel); border:1px solid var(--line-soft); padding:26px; text-align:center;
         font-family:var(--mono); font-size:13px; color:var(--silver-dim); }
  .gate a{ color:var(--gs); }

  .band{ background:var(--steel); border:1px solid var(--line-soft); padding:16px 18px 18px; margin:14px 0; }
  .band > h2{ font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:.09em;
              font-size:12.5px; color:var(--muted); margin:0 0 12px; display:flex; align-items:baseline; gap:9px; }
  .band > h2 .n{ color:var(--gs); font-family:var(--mono); font-size:10.5px; }

  /* band 1 */
  .verdict{ font-size:17px; line-height:1.5; color:var(--silver); }
  .verdict.hot{ color:var(--gs); }
  .vsub{ font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:7px; }
  .krow{ display:flex; gap:10px; align-items:baseline; padding:7px 2px; border-top:1px solid var(--line-soft);
         font-family:var(--mono); font-size:12px; color:var(--silver-dim); text-decoration:none; }
  .krow .kt{ flex:0 0 58px; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .krow.ours{ background:rgba(255,71,87,.06); }
  .krow.ours .kt{ color:var(--gs); }
  .krow .kw{ flex:1; min-width:0; overflow-wrap:anywhere; color:var(--silver); }
  .krow .ka{ white-space:nowrap; color:var(--muted); font-size:11px; }
  .krow:hover .kw{ color:var(--gs); }

  /* band 2 */
  .posture{ display:inline-block; font-family:var(--display); font-weight:700; letter-spacing:.12em;
            text-transform:uppercase; font-size:22px; padding:8px 18px; border:1px solid var(--line); color:var(--silver); }
  .posture.ROUTINE{ color:var(--silver); }
  .posture.ESCORT{ color:var(--amber); border-color:var(--amber); }
  .posture.HUNT{ color:var(--gs); border-color:var(--gs); }
  .posture.STANDDOWN{ color:var(--muted); }
  .fcline{ font-family:var(--mono); font-size:12px; color:var(--silver-dim); margin-top:11px; }
  .fcline b{ color:var(--ore); }
  .orders{ margin-top:14px; border-top:1px solid var(--line-soft); }
  .order{ display:flex; gap:12px; padding:9px 2px; border-bottom:1px solid var(--line-soft); }
  .order .os{ flex:0 0 82px; font-family:var(--mono); font-size:11px; color:var(--gs); letter-spacing:.05em; }
  .order .ot{ flex:1; font-size:13px; color:var(--silver-dim); line-height:1.5; }

  /* bands 3 + 4 */
  .cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr)); gap:11px; }
  .card{ background:var(--black); border:1px solid var(--line-soft); border-left:3px solid var(--line); padding:12px 13px; }
  .card.t{ border-left-color:var(--gs); }
  .card .ct{ font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:.04em;
             font-size:13.5px; color:var(--silver); }
  .card .cr{ font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
             color:var(--ore); margin-top:3px; }
  .card.t .cr{ color:var(--gs); }
  .card .cl{ font-size:12.5px; color:var(--silver-dim); line-height:1.5; margin-top:7px; }
  .card .cw{ font-family:var(--mono); font-size:10.5px; color:var(--muted); margin-top:7px;
             border-top:1px solid var(--line-soft); padding-top:6px; }
  .empty{ font-family:var(--mono); font-size:11.5px; color:var(--muted); line-height:1.6; }
  .foot{ font-family:var(--mono); font-size:10px; letter-spacing:.28em; text-transform:uppercase;
         color:var(--muted); text-align:center; margin-top:34px; }
  @media(max-width:600px){ .order .os{ flex-basis:64px; } .ghead img{ width:40px; height:40px; } }
</style></head>
<body>
<script src="/nav.js?v=16"></script>
<div class="gw">
  <div class="ghead">
    <img src="gss.png" alt="GSS seal">
    <div><h1>GOBSEC</h1><div class="sub">Goblin State Security &middot; the board</div></div>
  </div>

  <div id="gate" class="gate" style="display:none">
    This one is for goblins. <a href="/portal/">Log in</a> and it opens.
  </div>

  <div id="app" style="display:none">
    <div class="band">
      <h2><span class="n">01</span> RIGHT NOW</h2>
      <div id="verdict" class="verdict">Reading the wire&hellip;</div>
      <div id="vsub" class="vsub"></div>
      <div id="kills" style="margin-top:12px"></div>
    </div>

    <div class="band">
      <h2><span class="n">02</span> STANDING ORDERS</h2>
      <div id="posture"></div>
      <div id="fc" class="fcline"></div>
      <div class="orders" id="orders"></div>
    </div>

    <div class="band">
      <h2><span class="n">03</span> THE DOCTRINE</h2>
      <div id="doctrine"></div>
    </div>

    <div class="band">
      <h2><span class="n">04</span> THE GROUND</h2>
      <div id="threats"></div>
    </div>

    <div class="band">
      <h2><span class="n">05</span> THE BOARD</h2>
      <div id="board"></div>
    </div>

    <div class="foot">Assume Nothing</div>
  </div>
</div>
<script>
var TRIPWIRE = "https://bonk-tripwire.kyle-dd7.workers.dev";
function $(i){ return document.getElementById(i); }
function esc(v){ return String(v==null?"":v).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function ago(t){
  var ms = Date.now() - (typeof t === "number" ? t : Date.parse(t));
  if (!isFinite(ms) || ms < 0) ms = 0;
  var m = Math.floor(ms/60000); if (m < 60) return m + "m ago";
  var h = Math.floor(m/60); if (h < 48) return h + "h ago";
  return Math.floor(h/24) + "d ago";
}
function isk(v){ v = Number(v)||0;
  if (v >= 1e9) return (v/1e9).toFixed(1) + "b";
  if (v >= 1e6) return Math.round(v/1e6) + "m";
  return String(Math.round(v)); }
async function api(p){ var r = await fetch("/api/" + p, { credentials:"same-origin" });
  if (!r.ok) throw new Error(String(r.status)); return r.json(); }

/* ---- BAND 1: the only band that matters on most logins, and it is ALLOWED to say
   nothing is happening. A board that only looks alive during a crisis trains people
   to ignore it, so quiet gets said confidently. ---- */
function renderNow(ours, ground, sysNames){
  var since = Date.now() - 86400000;
  var recent = (ground || []).filter(function(k){ return (k.ts||0) > since; });
  var mine = (ours || []).filter(function(k){ return Date.parse(k.time) > since; });
  var v = $("verdict"), s = $("vsub");
  if (mine.length){
    v.className = "verdict hot";
    v.textContent = mine.length === 1
      ? "One of ours died in the last day. Read it before you undock."
      : mine.length + " of ours died in the last day. Something is working our space.";
  } else if (recent.length >= 12){
    v.className = "verdict hot";
    v.textContent = recent.length + " kills in our regions today. Busy out there, fly like it.";
  } else if (recent.length){
    v.className = "verdict";
    v.textContent = "Quiet enough. " + recent.length + " kill" + (recent.length===1?"":"s") + " in our regions today, none of them ours.";
  } else {
    v.className = "verdict";
    v.textContent = "Quiet. Nothing died in our regions today.";
  }
  s.textContent = "Last 24 hours · our corridor and the three regions we work.";
  var rows = [];
  mine.slice(0, 6).forEach(function(k){
    rows.push('<a class="krow ours" target="_blank" rel="noopener" href="https://zkillboard.com/kill/' + Number(k.id) + '/">' +
      '<span class="kt">OURS</span><span class="kw" data-i18n-skip>' + esc(k.ship||"?") +
      (k.victim ? " · " + esc(k.victim) : "") + (k.system ? " · " + esc(k.system) : "") +
      '</span><span class="ka">' + isk(k.value) + " · " + ago(k.time) + '</span></a>');
  });
  recent.slice(-8).reverse().forEach(function(k){
    var nm = (sysNames && sysNames[k.sysId]) || ("system " + k.sysId);
    rows.push('<a class="krow" target="_blank" rel="noopener" href="https://zkillboard.com/kill/' + Number(k.id) + '/">' +
      '<span class="kt" data-i18n-skip>' + esc(String(k.region||"?").slice(0,8)) + '</span>' +
      '<span class="kw" data-i18n-skip>' + esc(nm) + '</span>' +
      '<span class="ka">' + isk(k.isk) + " · " + ago(k.ts) + '</span></a>');
  });
  $("kills").innerHTML = rows.join("") || '<div class="empty">Nothing on the wire.</div>';
}

/* ---- BANDS 2-5 ---- */
function renderBrief(b){
  var p = b.posture || "ROUTINE";
  $("posture").innerHTML = '<span class="posture ' + esc(p.replace(/\s/g,"")) + '">' + esc(p) + '</span>';
  $("fc").innerHTML = b.fc
    ? 'FC today: <b data-i18n-skip>' + esc(b.fc) + '</b>'
    : 'No FC on. Do not start anything you cannot finish alone.';
  $("orders").innerHTML = (b.standing||[]).map(function(o){
    return '<div class="order"><span class="os" data-i18n-skip>' + esc(o.sys) + '</span>' +
           '<span class="ot">' + esc(o.rule) + '</span></div>'; }).join("");

  var d = b.doctrine || [];
  $("doctrine").innerHTML = d.length
    ? '<div class="cards">' + d.map(function(x){
        return '<div class="card"><div class="ct" data-i18n-skip>' + esc(x.hull) + '</div>' +
          (x.role ? '<div class="cr">' + esc(x.role) + '</div>' : '') +
          (x.note ? '<div class="cl">' + esc(x.note) + '</div>' : '') +
          '<div class="cw">' + (x.where ? esc(x.where) : "Ask in Discord, we will sort you out.") + '</div></div>';
      }).join("") + '</div>'
    : '<div class="empty">Doctrine is not posted yet. Fly cheap, fly what you can replace twice, ' +
      'and ask before you buy anything expensive. Officers can post the list from the admin desk.</div>';

  var t = b.threats || [];
  $("threats").innerHTML = t.length
    ? '<div class="cards">' + t.map(function(x){
        return '<div class="card t"><div class="ct" data-i18n-skip>' + esc(x.name) + '</div>' +
          '<div class="cr">' + esc([x.size, x.awake].filter(Boolean).join(" · ")) + '</div>' +
          (x.flies ? '<div class="cl"><b>Flies:</b> ' + esc(x.flies) + '</div>' : '') +
          (x.kills ? '<div class="cl"><b>Kills:</b> ' + esc(x.kills) + '</div>' : '') +
          (x.doabout ? '<div class="cw">' + esc(x.doabout) + '</div>' : '') + '</div>';
      }).join("") + '</div>'
    : '<div class="empty">No cards posted yet. The files exist, they are just not projected here. ' +
      'Officers: the workbench is at /portal/intel.</div>';
}

/* Band 5: built from the same kill feed, grouped by the pilots who showed up on it. */
function renderBoard(ours){
  var tally = {};
  (ours||[]).forEach(function(k){
    if (k.ours === "loss" || !k.victim) return;
    tally[k.victim] = (tally[k.victim]||0) + 1;
  });
  var names = Object.keys(tally).sort(function(a,b){ return tally[b]-tally[a]; });
  $("board").innerHTML = names.length
    ? '<div class="cards">' + names.slice(0,12).map(function(n){
        return '<div class="card"><div class="ct" data-i18n-skip>' + esc(n) + '</div>' +
               '<div class="cr">' + tally[n] + ' on the board</div></div>'; }).join("") + '</div>'
    : '<div class="empty">The board is empty. It stays empty until somebody puts a name on it, ' +
      'which is the entire point of the corp.</div>';
}

(async function(){
  var who = null;
  try { who = await (await fetch("/api/whoami", {credentials:"same-origin"})).json(); } catch(e){}
  if (!who || !who.loggedIn){ $("gate").style.display = ""; return; }
  $("app").style.display = "";
  var ours = [], ground = [], sysNames = {};
  try { var kf = await api("kills"); ours = kf.kills || []; } catch(e){}
  try {
    var r = await fetch(TRIPWIRE + "/region");
    ground = await r.json(); if (!Array.isArray(ground)) ground = [];
    var ids = []; ground.forEach(function(k){ if (k.sysId && ids.indexOf(k.sysId) < 0) ids.push(k.sysId); });
    if (ids.length){
      var nr = await fetch("https://esi.evetech.net/latest/universe/names/", {
        method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(ids.slice(0,500)) });
      if (nr.ok) (await nr.json()).forEach(function(n){ sysNames[n.id] = n.name; });
    }
  } catch(e){}
  renderNow(ours, ground, sysNames);
  renderBoard(ours);
  try { renderBrief(await api("gobsec/brief")); }
  catch(e){ renderBrief({ posture:"ROUTINE", standing:[], doctrine:[], threats:[] }); }
})();
</script>
</body></html>
