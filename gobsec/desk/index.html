<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GOBSEC — Combat Desk</title>
<link rel="stylesheet" href="/common.css?v=7">
<link rel="stylesheet" href="/intel-lenses.css?v=3">
<style>
  .gw{ max-width:1180px; margin:0 auto; padding:22px 18px 80px; }
  .gate{ max-width:560px; margin:60px auto; text-align:center; border:1px solid var(--line);
    background:var(--gob-panel,#101214); padding:34px 28px; }
  .gate h2{ font-family:var(--display); color:var(--silver); margin:12px 0 8px; }
  .gate p{ color:var(--silver-dim); font-size:13.5px; line-height:1.7; }
  .gate .lk{ font-size:28px; color:var(--gs,#ff4757); }
  .foot{ font-family:var(--mono); font-size:10px; letter-spacing:.24em; color:var(--muted);
    text-align:center; margin-top:52px; }
</style>
</head>
<body class="t-gobsec">
<div id="gate" class="gate" style="display:none">
  <div class="lk">&#9679;</div><h2>Not your clearance</h2>
  <p>GOBSEC operational desk. Cleared personnel are recognized by session.<br>Nobody types their way in here.</p>
</div>
<div id="app" style="display:none">
  <header class="bnhead">
    <div class="bnover">GOBSEC &middot; GOBLIN STATE SECURITY</div>
    <h1>COMBAT DESK</h1>
    <div class="sub">who is in local &middot; what is on grid &middot; where the fight is &middot; assume nothing, there is always a file</div>
  </header>
  <div class="gw" data-i18n-skip><div id="lensroot"></div>
    <div class="foot">ASSUME NOTHING</div>
  </div>
</div>
<script src="/nav.js?v=21"></script>
<script src="/intel-roles.js?v=1"></script>
<script src="/intel-lenses.js?v=3"></script>
<script>
/* the module owns the clearance check; this page only decides which shell shows */
fetch("/api/whoami",{credentials:"same-origin",cache:"no-store"})
  .then(function(r){ return r.ok?r.json():null; })
  .then(function(d){
    var ok=!!(d&&d.loggedIn&&(d.gobsec||d.gss));
    document.getElementById("app").style.display=ok?"":"none";
    document.getElementById("gate").style.display=ok?"none":"";
    if(ok) BONKLENS.mount(document.getElementById("lensroot"));
  })
  .catch(function(){ document.getElementById("gate").style.display=""; });
</script>
</body></html>
