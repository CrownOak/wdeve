name: pages
# Deploy the site to CLOUDFLARE PAGES (project bonkeve-mirror), which is where
# bonkeve.com has actually been served from since the mirror era began on
# 2026-07-18. This file used to deploy to GitHub Pages, and that is no longer where
# the site lives, so even with Actions working every generator push would have
# published to an origin nobody reads.
#
# ⚠ TWO THINGS MUST BE TRUE BEFORE THIS RUNS AT ALL
#   1. Actions must be enabled for the account. As of 2026-08-07 a dispatch returns
#      "Actions has been disabled for this user", which is why the whole bake set
#      runs on a laptop instead (see C:\Users\sales\wake-generators.ps1). Getting
#      that lifted is the single change that restores the cloud cron, because every
#      generator repo still carries its own run.yml.
#   2. Two repo secrets must exist: CLOUDFLARE_API_TOKEN (scoped to Pages: Edit on
#      this account) and CLOUDFLARE_ACCOUNT_ID.
#
# Until both are true this file is inert and the laptop keeps baking. It is here so
# that the day the flag lifts, restoring the cloud cron is a dispatch and not a
# rebuild.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest push deploys: generator pushes land close together and there is
# no value in publishing an intermediate state that is already superseded.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Direct upload of the working tree, the same shape the laptop runner does
      # with `git archive | wrangler pages deploy`. No build step: every page here
      # is either hand written or already baked by the generator that pushed it.
      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy . --project-name bonkeve-mirror --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Same check-in the laptop makes, so the portal watchdog cannot tell the
      # difference between runners and a silent move between them still shows up.
      - name: Check in with the portal
        if: always()
        continue-on-error: true
        run: |
          curl -sS -X POST https://bonkeve.com/api/ops/heartbeat \
            -H "Content-Type: application/json" \
            -H "X-Ops-Token: ${{ secrets.OPS_TOKEN }}" \
            -d "{\"job\":\"deploy\",\"ok\":${{ job.status == 'success' }},\"source\":\"actions\",\"detail\":\"pages deploy\"}"
