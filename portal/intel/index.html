<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<title>GSS</title>
<link rel="icon" href="/portal/intel/gss2-96.png">
<link rel="stylesheet" href="/common.css?v=5">
<style>
/* GOBLIN STATE SECURITY — the cold room. No goblin jokes in here, per doctrine. */
:root{ --ice:#8fb7c9; --ice-dim:#5f7f8c; --hostile:#f0817a; --amberw:#e9c46a; --ally:#7fb0ff; --ctx:#6f776f; }
body{ background:#06070a; }
body::before{ content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:linear-gradient(rgba(150,168,158,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(150,168,158,.025) 1px, transparent 1px);
  background-size:44px 44px; }
.gss-wrap{ max-width:1120px; margin:0 auto; padding:26px 20px 80px; position:relative; z-index:1; }

/* header */
.gss-head{ display:flex; align-items:center; gap:16px; border-bottom:1px solid var(--line); padding-bottom:18px; margin-bottom:8px; }
/* the seal: big, centered, static, translucent, behind everything (Kyle) */
.gss-watermark{ position:fixed; top:47%; left:50%; transform:translate(-50%,-50%); width:680px; max-width:94vw;
  opacity:.13; pointer-events:none; user-select:none; z-index:0; }
@media(max-width:640px){ .gss-watermark{ opacity:.09; width:120vw; } }
/* clearance checkpoint (the honeypot bait) */
.cp{ display:flex; gap:8px; justify-content:center; max-width:340px; margin:16px auto 0; }
.cp input{ flex:1; background:#06070a; border:1px solid var(--line); color:var(--silver); font-family:var(--mono); font-size:13px; padding:9px 11px; text-align:center; letter-spacing:.1em; }
.cp input:focus{ outline:none; border-color:var(--ice); }
.cp button{ background:var(--ice); color:#04140a; border:0; font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:.06em; padding:0 16px; cursor:pointer; }
.gss-gate .hint{ margin-top:16px; font-size:11px; color:var(--muted); }
.gss-gate .hint a{ color:var(--ice); }
.gss-title{ font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:.14em; font-size:19px; color:var(--silver); }
.gss-motto{ margin-left:auto; font-family:var(--mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--ice-dim); }
.subline{ font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:var(--muted); margin:0 0 26px; }

/* gate / denial */
.gss-gate{ padding:70px 24px; text-align:center; }
.gss-gate .lock{ font-size:30px; color:var(--hostile); }
.gss-gate h2{ font-family:var(--display); text-transform:uppercase; letter-spacing:.1em; font-size:17px; color:var(--silver); margin:14px 0 6px; }
.gss-gate p{ font-family:var(--mono); font-size:12px; color:var(--muted); letter-spacing:.03em; }
.gss-gate a{ color:var(--ice); }

/* board */
.board{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:0 0 30px; }
@media(max-width:760px){ .board{ grid-template-columns:1fr; } }
.card{ border:1px solid var(--line); background:rgba(20,23,26,.5); padding:16px 18px; }
.card h3{ font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ice); margin:0 0 12px; }
.counts{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ font-family:var(--mono); font-size:11px; letter-spacing:.04em; padding:4px 9px; border:1px solid var(--line); color:var(--silver-dim); background:#0a0c0f; }
.chip b{ color:var(--silver); }
.mini{ display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line-soft); }
.mini:first-of-type{ border-top:0; }
.mini .nm{ font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:.02em; font-size:13px; color:var(--silver); cursor:pointer; }
.mini .nm:hover{ color:var(--ice); }
.mini .tag{ font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; padding:2px 7px; border:1px solid currentColor; }
.mini .sm{ font-family:var(--mono); font-size:11px; color:var(--muted); margin-left:auto; }
.dot{ width:8px; height:8px; flex:none; }
.foot-line{ font-family:var(--mono); font-size:11px; color:var(--silver-dim); padding:5px 0; }
.foot-line b{ color:var(--ice-dim); letter-spacing:.04em; }

/* cabinet */
.sec-h{ display:flex; align-items:center; gap:12px; margin:26px 0 12px; }
.sec-h .ix{ font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ice); }
.sec-h::after{ content:""; flex:1; height:1px; background:var(--line-soft); }
.filters{ display:flex; flex-wrap:wrap; gap:7px; margin:0 0 16px; }
.filters button{ font-family:var(--mono); font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; padding:5px 11px;
  border:1px solid var(--line); background:transparent; color:var(--silver-dim); cursor:pointer; }
.filters button:hover{ border-color:var(--ice); color:var(--ice); }
.filters button.on{ background:var(--ice); color:#04140a; border-color:var(--ice); font-weight:700; }
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media(max-width:760px){ .grid{ grid-template-columns:1fr; } }
.ecard{ border:1px solid var(--line); background:rgba(20,23,26,.5); padding:14px 16px; cursor:pointer; position:relative; transition:border-color .15s, transform .15s; }
.ecard:hover{ transform:translateY(-2px); border-color:var(--ice); }
.ecard .bar{ position:absolute; left:0; top:0; bottom:0; width:3px; }
.ecard .top{ display:flex; align-items:baseline; gap:9px; }
.ecard .en{ font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:.02em; font-size:15px; color:var(--silver); }
.ecard .tk{ font-family:var(--mono); font-size:11px; color:var(--muted); }
.ecard .cl{ margin-left:auto; font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; padding:2px 7px; border:1px solid currentColor; }
.ecard .sy{ font-size:13px; color:var(--silver-dim); margin-top:7px; line-height:1.5; }
.ecard .mt{ display:flex; gap:12px; margin-top:9px; font-family:var(--mono); font-size:10px; letter-spacing:.04em; color:var(--muted); }
.ecard .mt .th{ color:var(--amberw); }
.ecard .mt .st b{ color:var(--silver-dim); }
.stale{ color:var(--hostile)!important; }

/* detail */
.detail{ position:fixed; inset:0; z-index:60; background:rgba(4,5,8,.86); overflow-y:auto; padding:30px 16px; }
.dwrap{ max-width:820px; margin:0 auto; background:#0a0c10; border:1px solid var(--line); padding:26px 28px 40px; position:relative; }
.dclose{ position:absolute; right:14px; top:12px; background:none; border:1px solid var(--line); color:var(--silver-dim); font-family:var(--mono); font-size:12px; padding:4px 10px; cursor:pointer; }
.dclose:hover{ border-color:var(--ice); color:var(--ice); }
.dhead{ border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:16px; }
.dhead .dn{ font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:.03em; font-size:24px; color:var(--silver); }
.dhead .dmeta{ display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:10px; font-family:var(--mono); font-size:11px; color:var(--muted); }
.dhead .dmeta b{ color:var(--ice-dim); }
.kq{ background:rgba(143,183,201,.06); border-left:3px solid var(--ice); padding:12px 16px; margin:14px 0; }
.kq .lab{ font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ice); }
.kq .q{ font-size:14px; color:var(--silver); margin-top:4px; }
.verdict{ background:#0d0f13; border:1px solid var(--line); border-left:3px solid var(--amberw); padding:14px 16px; margin:14px 0; }
.verdict .lab{ font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--amberw); }
.verdict .v{ font-size:14.5px; color:var(--silver); margin-top:5px; line-height:1.6; }
.dsec{ margin:14px 0; }
.dsec .sh{ font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:.03em; font-size:13px; color:var(--ice); margin-bottom:4px; }
.dsec .sb{ font-size:14px; color:var(--silver-dim); line-height:1.6; }
.grade{ font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; color:var(--muted); border:1px solid var(--line); padding:1px 6px; margin-left:8px; vertical-align:2px; }
.rels{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
.rel{ font-family:var(--mono); font-size:11px; color:var(--silver-dim); border:1px solid var(--line-soft); padding:4px 9px; }
.rel b{ color:var(--ice-dim); text-transform:uppercase; font-size:9.5px; letter-spacing:.05em; }
.live{ font-family:var(--mono); font-size:11.5px; color:var(--silver-dim); line-height:1.7; }
.live b{ color:var(--ice-dim); }
.dblock{ margin-top:20px; padding-top:14px; border-top:1px solid var(--line-soft); }
.dblock > .lab{ font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ice); margin-bottom:8px; }

/* field rules */
.rules{ counter-reset:r; }
.rule{ display:flex; gap:12px; padding:9px 0; border-top:1px solid var(--line-soft); }
.rule:first-child{ border-top:0; }
.rule .rn{ font-family:var(--display); font-weight:700; color:var(--ice-dim); font-size:14px; min-width:22px; }
.rule .rt b{ color:var(--silver); }
.rule .rt{ font-size:13px; color:var(--muted); line-height:1.5; }

/* add form */
.addbar{ margin:22px 0 0; }
.addbar button.open{ font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:7px 14px; border:1px solid var(--ice); background:transparent; color:var(--ice); cursor:pointer; }
.addform{ display:none; margin-top:14px; border:1px solid var(--line); background:rgba(20,23,26,.5); padding:16px 18px; }
.addform.show{ display:block; }
.addform .row{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
.addform input, .addform select, .addform textarea{ background:#06070a; border:1px solid var(--line); color:var(--silver); font-family:var(--mono); font-size:12px; padding:8px 10px; }
.addform input.nm{ flex:1; min-width:180px; }
.addform textarea{ width:100%; min-height:56px; }
.addform button.go{ font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:.06em; padding:9px 16px; background:var(--ice); color:#04140a; border:0; cursor:pointer; }
.err{ color:var(--hostile); font-family:var(--mono); font-size:11px; min-height:14px; margin-top:6px; }
</style>
</head>
<body>
<img class="gss-watermark" src="/portal/intel/gss2-512.png" alt="" aria-hidden="true">
<div class="gss-wrap">
  <div class="gss-head">
    <div>
      <div class="gss-title">Goblin State Security</div>
    </div>
    <div class="gss-motto" id="motto">Assume nothing</div>
  </div>
  <div class="subline">We watch, we record, we know. There is always a file.</div>

  <div id="gate" class="gss-gate">
    <div id="gatemsg"><p>Checking clearance...</p></div>
  </div>

  <main id="app" style="display:none">
    <div class="board" id="board"></div>

    <div class="sec-h"><span class="ix">The Cabinet</span></div>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>

    <div class="addbar">
      <button class="open" id="addToggle">+ open a file</button>
      <div class="addform" id="addForm">
        <div class="row">
          <input class="nm" id="f_name" placeholder="entity name (alliance, corp, or pilot)" autocomplete="off">
          <select id="f_type"><option value="alliance">alliance</option><option value="corp">corp</option><option value="pilot">pilot</option></select>
          <select id="f_class">
            <option value="watch">watch</option><option value="hostile">hostile</option><option value="hostile_priority">hostile priority</option>
            <option value="neutral">neutral</option><option value="friendly">friendly</option><option value="ally">ally</option>
            <option value="target">target</option><option value="context">context</option>
          </select>
          <select id="f_standing"><option value="neutral">neutral</option><option value="red">red</option><option value="blue">blue</option><option value="nip">nip</option><option value="active_deal">active deal</option></select>
          <input id="f_threat" type="number" min="0" max="5" value="0" style="width:64px" title="threat 0-5">
        </div>
        <div class="row"><textarea id="f_summary" placeholder="one line summary"></textarea></div>
        <button class="go" id="f_go">file it (resolves + enriches from ESI)</button>
        <div class="err" id="f_err"></div>
      </div>
    </div>
  </main>
</div>

<div class="detail" id="detail" style="display:none"><div class="dwrap" id="dwrap"></div></div>

<script>
var CLS = {
  hostile:{c:"#f0817a",l:"hostile"}, hostile_priority:{c:"#f0817a",l:"hostile priority"},
  watch:{c:"#e9c46a",l:"watch"}, neutral:{c:"#9aa39c",l:"neutral"},
  friendly:{c:"#7fb0ff",l:"friendly"}, ally:{c:"#7fb0ff",l:"ally"},
  target:{c:"#ff9d5c",l:"target"}, context:{c:"#6f776f",l:"context"}, self:{c:"#46ff5e",l:"self"}
};
var FIELD_RULES = [
  ["Assume nothing.","A standing you did not verify is not set. A system you did not scout is not clear. Confirm, then move."],
  ["Never go against your gut.","If a fit, a fleet, a deal, or a convo feels wrong, it is wrong. Dock up. Explain it later."],
  ["Everyone may be under enemy control.","A blue on grid can still shoot you. A friendly convo can be the setup. Standing is a hope, not a shield."],
  ["Assume you are watched.","If we can see them on the killboard, they can see us. Every undock is on the record."],
  ["Blend in, stay in cover.","Look like what we are, a boring mining corp. Boring survives. Never flash value you do not have to."],
  ["Vary the pattern.","Never the same cyno pilot twice, never the same route on a schedule. Predictable is dead."],
  ["Do not provoke the opposition.","We do not poke wolves for content. We are the neighbor who is not worth the week."],
  ["Pick the time and the place.","We fight and deal on our terms, in our window, or not at all."],
  ["Keep the exit open.","Every op, deal, and structure has a way out priced in before we commit. Nothing load bearing rests on their word."],
  ["Once is accident, twice coincidence, three times enemy action.","One kill in our space is noise. A pattern is a campaign. The warning trips on the third, not the first."]
];
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function clsInfo(k){ return CLS[k]||{c:"#9aa39c",l:k}; }
function ago(iso){ if(!iso) return "never"; var d=Math.floor((Date.now()-Date.parse(iso))/86400000); return d<=0?"today":d+"d ago"; }
function api(path,opts){ return fetch("/api"+path,Object.assign({credentials:"same-origin"},opts||{})).then(function(r){return r.json();}); }

var curClass = "";

// GSS emergency override. do not share.
var OVERRIDE = "assume-everything";
function toVoid(reason){
  try{ fetch("/api/gss/trip",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({reason:reason})}); }catch(e){}
  location.href="/portal/intel/void/";
}
function tryCode(){
  var el=document.getElementById("gsspw"); var v=(el.value||"").trim();
  if(!v){ el.focus(); return; }
  // one attempt, any code: this route is not a way in, it is a trip. Straight to the wall.
  toVoid(v===OVERRIDE ? "override" : "wrong");
}
function showCheckpoint(){
  document.getElementById("gatemsg").innerHTML=
    '<h2>Clearance checkpoint</h2>'+
    '<p>Cleared personnel are recognized by session. Officers, admins, and designated GSS pass without a code.</p>'+
    '<div class="cp"><input id="gsspw" type="password" placeholder="clearance code" autocomplete="off" autofocus><button id="gsspwgo">submit</button></div>'+
    '<div class="err" id="gsspwerr" style="text-align:center"></div>'+
    '<p class="hint">Cleared and still seeing this? <a href="/portal/">Log in to the portal</a> first.</p>';
  document.getElementById("gsspwgo").addEventListener("click",tryCode);
  document.getElementById("gsspw").addEventListener("keydown",function(e){ if(e.key==="Enter") tryCode(); });
}
function init(){
  api("/whoami").then(function(w){
    // the ONLY true way in: a cleared session (officer, admin, or designated GSS)
    if(w && w.loggedIn && w.gss){
      document.getElementById("gate").style.display="none";
      document.getElementById("app").style.display="block";
      loadBoard(); loadEntities(""); return;
    }
    showCheckpoint(); // everyone else meets the bait
  }).catch(function(){ document.getElementById("gatemsg").innerHTML='<p class="err">GSS is not answering. Try again.</p>'; });
}

function loadBoard(){
  api("/gss/board").then(function(d){
    if(!d||!d.ok) return;
    document.getElementById("motto").textContent = d.motto||"Assume nothing";
    var counts=d.counts||{}, order=["hostile_priority","hostile","watch","target","neutral","friendly","ally","context"];
    var chips=order.filter(function(k){return counts[k];}).map(function(k){ var ci=clsInfo(k); return '<span class="chip" style="border-color:'+ci.c+'33"><b style="color:'+ci.c+'">'+counts[k]+'</b> '+ci.l+'</span>'; }).join("");
    function miniRow(e){ var ci=clsInfo(e.classification); return '<div class="mini"><span class="dot" style="background:'+ci.c+'"></span><span class="nm" onclick="openEntity('+e.id+')">'+esc(e.name)+'</span><span class="tag" style="color:'+ci.c+'">'+ci.l+'</span><span class="sm">threat '+e.threat_level+' &middot; '+esc(e.bonk_standing)+'</span></div>'; }
    var threats=(d.threats||[]).map(miniRow).join("")||'<div class="foot-line">nothing on the board</div>';
    var deals=(d.deals||[]).map(miniRow).join("")||'<div class="foot-line">no active files</div>';
    var fp=(d.footprint||[]).map(function(f){ return '<div class="foot-line"><b>'+esc(f.kind)+'</b> &nbsp;'+esc(f.label)+' &middot; '+esc((f.systems||[]).join(", "))+'</div>'; }).join("");
    var stale=d.stalest?('<div class="foot-line"><b>stalest</b> &nbsp;<span class="nm" style="cursor:pointer;color:var(--silver)" onclick="openEntity('+d.stalest.id+')">'+esc(d.stalest.name)+'</span> &middot; reviewed '+ago(d.stalest.verified_at)+'</div>'):'';
    document.getElementById("board").innerHTML =
      '<div class="card"><h3>Situation &middot; '+d.total+' files</h3><div class="counts">'+chips+'</div>'+stale+'<div style="margin-top:12px">'+fp+'</div></div>'+
      '<div class="card"><h3>Top threats</h3>'+threats+'</div>'+
      '<div class="card"><h3>Active files &amp; deals</h3>'+deals+'</div>'+
      '<div class="card"><h3>Field Rules</h3><div class="foot-line" style="color:var(--muted)">Assume nothing. Everyone may be under enemy control. The warning trips on the third, not the first.</div><div class="foot-line"><span class="nm" style="cursor:pointer;color:var(--ice)" onclick="openRules()">read all ten &#8594;</span></div></div>';
  });
}

function loadEntities(cls){
  curClass=cls;
  var fl=[["","all"],["hostile_priority","priority"],["hostile","hostile"],["watch","watch"],["neutral","neutral"],["friendly","friendly"],["ally","ally"],["target","target"],["context","context"]];
  document.getElementById("filters").innerHTML=fl.map(function(f){ return '<button class="'+(cls===f[0]?"on":"")+'" onclick="loadEntities(\''+f[0]+'\')">'+f[1]+'</button>'; }).join("");
  api("/gss/entities"+(cls?("?class="+cls):"")).then(function(d){
    if(!d||!d.ok) return;
    document.getElementById("grid").innerHTML=(d.entities||[]).map(function(e){
      var ci=clsInfo(e.classification);
      var staleCls = e.verified_at && (Date.now()-Date.parse(e.verified_at))>21*86400000 ? "stale":"";
      return '<div class="ecard" onclick="openEntity('+e.id+')"><span class="bar" style="background:'+ci.c+'"></span>'+
        '<div class="top"><span class="en">'+esc(e.name)+'</span>'+(e.ticker?'<span class="tk">['+esc(e.ticker)+']</span>':'')+'<span class="cl" style="color:'+ci.c+'">'+ci.l+'</span></div>'+
        '<div class="sy">'+esc(e.summary||"")+'</div>'+
        '<div class="mt"><span class="th">threat '+e.threat_level+'</span><span class="st">standing <b>'+esc(e.bonk_standing)+'</b></span><span class="'+staleCls+'">reviewed '+ago(e.verified_at)+'</span></div></div>';
    }).join("")||'<div class="foot-line">no files on this shelf</div>';
  });
}

function openEntity(id){
  api("/gss/entity/"+id).then(function(d){
    if(!d||!d.ok) return;
    var e=d.entity, ci=clsInfo(e.classification);
    var hostile = e.classification==="hostile"||e.classification==="hostile_priority";
    var meta='<span><b>type</b> '+esc(e.eve_type)+'</span><span><b>class</b> '+ci.l+'</span><span><b>threat</b> '+e.threat_level+'/5</span><span><b>standing</b> '+esc(e.bonk_standing)+'</span><span><b>reviewed</b> '+ago(e.verified_at)+'</span>';
    var doss=(e.dossiers||[]).map(function(ds){
      var kq=ds.key_question?'<div class="kq"><div class="lab">Standing question</div><div class="q">'+esc(ds.key_question)+'</div></div>':'';
      var vd=ds.verdict?'<div class="verdict"><div class="lab">Verdict</div><div class="v">'+esc(ds.verdict)+'</div></div>':'';
      var secs=(ds.sections||[]).map(function(s){
        var g=(s.reliability||s.credibility||s.confidence)?'<span class="grade">'+esc((s.reliability||"?")+(s.credibility||"?"))+(s.confidence?" &middot; "+esc(s.confidence):"")+'</span>':'';
        return '<div class="dsec"><div class="sh">'+esc(s.h||"")+g+'</div><div class="sb">'+esc(s.body||"")+'</div></div>';
      }).join("");
      return kq+vd+secs;
    }).join("")||'<div class="foot-line">no written file yet</div>';
    var rels=(e.relationships||[]).length?('<div class="dblock"><div class="lab">Relationships</div><div class="rels">'+e.relationships.map(function(r){ return '<span class="rel"><b>'+esc(r.rel_type)+'</b> '+esc(r.to||"")+'</span>'; }).join("")+'</div></div>'):'';
    var live="";
    if(e.enrich){ var en=e.enrich; var parts=[];
      if(en.ticker) parts.push("<b>ticker</b> "+esc(en.ticker));
      if(en.member_count!=null) parts.push("<b>members</b> "+en.member_count);
      if(en.corp_count!=null) parts.push("<b>corps</b> "+en.corp_count);
      if(en.date_founded) parts.push("<b>founded</b> "+esc(String(en.date_founded).slice(0,10)));
      if(en.war_eligible!=null) parts.push("<b>war eligible</b> "+(en.war_eligible?"yes":"no"));
      if(en.eve_id) parts.push("<b>id</b> "+en.eve_id);
      live='<div class="dblock"><div class="lab">Live data &middot; ESI '+ago(e.enrich_at)+'</div><div class="live">'+(parts.join(" &middot; ")||"nothing resolved")+'</div></div>';
    } else {
      live='<div class="dblock"><div class="lab">Live data</div><div class="live" style="color:var(--muted)">not enriched yet</div></div>';
    }
    var rules=hostile?('<div class="dblock"><div class="lab">GSS Field Rules</div><div class="rules">'+FIELD_RULES.map(function(r,i){ return '<div class="rule"><span class="rn">'+(i+1)+'</span><span class="rt"><b>'+esc(r[0])+'</b> '+esc(r[1])+'</span></div>'; }).join("")+'</div></div>'):'';
    document.getElementById("dwrap").innerHTML=
      '<button class="dclose" onclick="closeDetail()">close</button>'+
      '<div class="dhead"><div class="dn" style="border-left:3px solid '+ci.c+';padding-left:12px">'+esc(e.name)+(e.ticker?' <span style="font-family:var(--mono);font-size:14px;color:var(--muted)">['+esc(e.ticker)+']</span>':'')+'</div><div class="dmeta">'+meta+'</div></div>'+
      doss+rels+live+rules+
      '<div class="dblock"><button class="dclose" style="position:static" onclick="enrich('+e.id+')">refresh from ESI</button> <button class="dclose" style="position:static" onclick="markVerified('+e.id+')">mark reviewed today</button></div>';
    document.getElementById("detail").style.display="block";
    document.body.style.overflow="hidden";
  });
}
function openRules(){
  document.getElementById("dwrap").innerHTML='<button class="dclose" onclick="closeDetail()">close</button>'+
    '<div class="dhead"><div class="dn">GSS Field Rules</div><div class="dmeta"><span>The Moscow Rules, our neighborhood. First thing you read.</span></div></div>'+
    '<div class="rules">'+FIELD_RULES.map(function(r,i){ return '<div class="rule"><span class="rn">'+(i+1)+'</span><span class="rt"><b>'+esc(r[0])+'</b> '+esc(r[1])+'</span></div>'; }).join("")+'</div>';
  document.getElementById("detail").style.display="block"; document.body.style.overflow="hidden";
}
function closeDetail(){ document.getElementById("detail").style.display="none"; document.body.style.overflow=""; }
function enrich(id){ api("/gss/entity/"+id+"/enrich",{method:"POST"}).then(function(d){ openEntity(id); loadEntities(curClass); }); }
function markVerified(id){ api("/gss/entity/"+id,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({verify:true})}).then(function(){ openEntity(id); loadBoard(); loadEntities(curClass); }); }

document.getElementById("detail").addEventListener("click",function(e){ if(e.target.id==="detail") closeDetail(); });
document.getElementById("addToggle").addEventListener("click",function(){ document.getElementById("addForm").classList.toggle("show"); });
document.getElementById("f_go").addEventListener("click",function(){
  var name=document.getElementById("f_name").value.trim();
  if(!name){ document.getElementById("f_err").textContent="name required"; return; }
  var body={ name:name, eve_type:document.getElementById("f_type").value, classification:document.getElementById("f_class").value,
    bonk_standing:document.getElementById("f_standing").value, threat_level:parseInt(document.getElementById("f_threat").value,10)||0,
    summary:document.getElementById("f_summary").value.trim() };
  document.getElementById("f_go").disabled=true;
  api("/gss/entity",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(d){
    document.getElementById("f_go").disabled=false;
    if(!d||!d.ok){ document.getElementById("f_err").textContent=(d&&d.error)||"could not file it"; return; }
    document.getElementById("f_name").value=""; document.getElementById("f_summary").value="";
    document.getElementById("addForm").classList.remove("show");
    loadBoard(); loadEntities(curClass);
  });
});

init();
</script>
<script src="/nav.js?v=14"></script>
</body>
</html>
