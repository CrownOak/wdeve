<!doctype html>
<html lang="en"><head><meta charset="utf-8"><script src="/i18n.js?v=6"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BONK &middot; Command Center</title>
<link rel="stylesheet" href="/common.css?v=7">
<style>
/* ---- admin layout: left rail + main ---- */
.adminlay{ display:flex; max-width:1400px; margin:0 auto; min-height:calc(100vh - 54px); }
#rail{ width:212px; flex:0 0 212px; border-right:1px solid var(--line); padding:16px 0 30px;
       position:sticky; top:54px; align-self:flex-start; height:calc(100vh - 54px); overflow:auto; }
.rtitle{ font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:.06em;
         font-size:13px; color:var(--silver); padding:2px 18px 12px; }
.rsub{ font-family:var(--mono); font-size:10.5px; color:var(--muted); padding:0 18px 14px; letter-spacing:.04em; }
.rlink{ display:flex; align-items:center; gap:8px; padding:9px 16px; font-family:var(--mono); font-size:11.5px;
        letter-spacing:.08em; text-transform:uppercase; color:var(--silver-dim); text-decoration:none;
        border-left:2px solid transparent; }
.rlink:hover{ color:var(--ore); }
.rlink.cur{ color:var(--ore); border-left-color:var(--ore); background:var(--steel); }
.rbadge{ margin-left:auto; font-family:var(--mono); font-size:10px; color:#04140a; background:var(--amber);
         padding:1px 6px; font-weight:700; }
#main{ flex:1; padding:20px 24px 70px; min-width:0; }
.sechead{ font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:.05em;
          font-size:17px; color:var(--silver); margin:2px 0 4px; }
.secsub{ font-family:var(--mono); font-size:11.5px; color:var(--muted); letter-spacing:.03em; margin:0 0 16px; }
@media(max-width:860px){
  .adminlay{ display:block; }
  #rail{ position:sticky; top:54px; width:auto; height:auto; display:flex; overflow-x:auto;
         border-right:0; border-bottom:1px solid var(--line); background:rgba(7,8,9,.94); z-index:40; padding:0; }
  .rtitle,.rsub{ display:none; }
  .rlink{ white-space:nowrap; border-left:0; border-bottom:2px solid transparent; padding:11px 12px; }
  .rlink.cur{ border-bottom-color:var(--ore); background:transparent; }
  #main{ padding:16px 12px 60px; }
}
/* ---- panels / tiles ---- */
.panel{ background:var(--steel); border:1px solid var(--line-soft); padding:14px 16px; margin:0 0 16px; }
.ptitle{ font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:.06em;
         font-size:13px; color:var(--silver); margin:0 0 10px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.ptitle .pn{ font-family:var(--mono); font-size:11px; color:var(--muted); text-transform:none; letter-spacing:.03em; }
.nap{ color:var(--muted); font-family:var(--mono); font-size:12px; padding:14px 4px; }
.pulse{ display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:10px; margin:0 0 16px; }
.tile{ background:var(--steel); border:1px solid var(--line-soft); padding:11px 13px; }
.tile .k{ font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.tile .v{ font-family:var(--mono); font-size:21px; color:var(--ore); margin-top:4px; font-variant-numeric:tabular-nums; }
.tile .v.warn{ color:var(--amber); }
.tile .v.dim{ color:var(--silver-dim); font-size:15px; }
/* ---- THE BOOKS ---- */
.bktab{ width:100%; border-collapse:collapse; font-family:var(--mono); font-size:12px;
        font-variant-numeric:tabular-nums; }
.bktab th{ text-align:right; font-size:10px; letter-spacing:.07em; text-transform:uppercase;
           color:var(--muted); font-weight:400; padding:0 0 7px; border-bottom:1px solid var(--line-soft); }
.bktab th:first-child, .bktab td:first-child{ text-align:left; }
.bktab td{ text-align:right; padding:7px 0; border-bottom:1px solid var(--line-soft); color:var(--silver-dim); }
.bktab td.keep{ color:var(--ore); }
.bktab tr:last-child td{ border-bottom:0; }
.bktab td+td, .bktab th+th{ padding-left:14px; }
/* the P&L waterfall: one bar, revenue split into where it goes */
.bkbar{ display:flex; height:20px; border:1px solid var(--line-soft); background:var(--black);
        overflow:hidden; position:relative; }
.bkbar i{ display:block; height:100%; }
/* where revenue runs out, drawn only when the costs are longer than the bar of income */
.bkbar u{ position:absolute; top:-1px; bottom:-1px; width:0; border-left:2px dashed var(--amber); }
.bkkey{ display:flex; flex-wrap:wrap; gap:12px; margin-top:9px; font-family:var(--mono); font-size:11px; color:var(--muted); }
.bkkey span{ display:flex; align-items:center; gap:5px; }
.bkkey b{ width:9px; height:9px; display:inline-block; }
.bkline{ font-family:var(--mono); font-size:12px; color:var(--silver-dim); margin-top:10px; line-height:1.65; }
.bkline em{ font-style:normal; color:var(--ore); }
.bkline.warnline em{ color:var(--amber); }
.bkcaveat{ font-family:var(--mono); font-size:11px; color:var(--muted); line-height:1.6; margin-top:10px;
           border-left:2px solid var(--line); padding-left:10px; }
.bkgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
.bkgrid .panel{ margin:0; }
/* ---- queue rows ---- */
.qrow{ display:flex; gap:10px; align-items:center; padding:8px 8px; border-top:1px solid var(--line-soft);
       flex-wrap:wrap; font-size:13.5px; }
.qrow:first-of-type{ border-top:0; }
.qrow:hover{ background:var(--steel-2); }
.qwho{ color:var(--silver); font-weight:600; cursor:pointer; display:flex; align-items:center; }
.qwho:hover{ color:var(--ore); }
.qmeta{ font-family:var(--mono); font-size:11px; color:var(--muted); }
.qval{ font-family:var(--mono); font-size:12.5px; color:var(--ore); font-variant-numeric:tabular-nums; }
.qact{ margin-left:auto; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
/* ---- funnel ---- */
.fun{ display:flex; flex-direction:column; gap:5px; }
.frow{ display:flex; align-items:center; gap:10px; }
.frow .fk{ width:96px; flex:0 0 96px; font-family:var(--mono); font-size:10.5px; letter-spacing:.05em;
           text-transform:uppercase; color:var(--muted); text-align:right; }
.frow .ft{ flex:1; background:var(--black); border:1px solid var(--line-soft); height:20px; position:relative; }
.frow .fb{ position:absolute; left:0; top:0; bottom:0; background:var(--ore-deep); opacity:.85; }
.frow .fc{ width:52px; font-family:var(--mono); font-size:12px; color:var(--silver); font-variant-numeric:tabular-nums; }
/* ---- avatars ---- */
.avm{ width:22px; height:22px; display:inline-flex; margin-right:8px; border:1px solid var(--line);
      vertical-align:middle; flex:0 0 22px; overflow:hidden; }
.avm img,.avm svg{ display:block; width:100%; height:100%; object-fit:cover; }
.avm.lg{ width:44px; height:44px; flex-basis:44px; }
/* ---- skeletons ---- */
@keyframes skm{ 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.skel{ background:linear-gradient(90deg,var(--steel) 25%,var(--steel-2) 50%,var(--steel) 75%);
       background-size:200% 100%; animation:skm 1.3s linear infinite; border:1px solid var(--line-soft);
       height:64px; margin:0 0 12px; }
.skel.sm{ height:30px; } .skel.lg{ height:150px; }
/* ---- toasts ---- */
#toasts{ position:fixed; right:14px; bottom:14px; z-index:400; display:flex; flex-direction:column; gap:8px; max-width:min(360px,90vw); }
.toast{ background:var(--steel); border:1px solid var(--ore); color:var(--silver); padding:10px 14px;
        font-family:var(--mono); font-size:12px; line-height:1.5; box-shadow:0 8px 22px rgba(0,0,0,.5); }
.toast.bad{ border-color:var(--red); color:var(--red); }
/* ---- drawer + modal ---- */
#dback{ position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:110; display:none; }
#drawer{ position:fixed; top:0; right:0; bottom:0; width:min(720px,100vw); background:var(--black);
         border-left:1px solid var(--line); z-index:120; overflow:auto; padding:18px 20px 70px; display:none; }
.dclose{ background:transparent; border:1px solid var(--line); color:var(--silver-dim);
         font-family:var(--mono); font-size:12px; padding:5px 12px; cursor:pointer; flex:0 0 auto; }
.dclose:hover{ border-color:var(--ore); color:var(--ore); }
/* Drawer header. Close used to be float:right emitted BEFORE the name block, so
   the header slid under it and collided with long names at narrow widths. It is
   a flex item now, and the bar sticks so Close stays reachable in a long profile. */
.dwhead{ display:flex; align-items:center; gap:12px; margin:0 0 14px; padding:2px 0 12px;
         border-bottom:1px solid var(--line-soft); position:sticky; top:-18px; z-index:2;
         background:var(--black); }
.dwhead .dwid{ min-width:0; flex:1 1 auto; }
.dwhead .sechead{ margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* One toggle component. This replaced five copies of the same inline style, which
   existed only to defeat `.frm label` (block/mono/10.5px) — a flag row is not a
   field label. Full width, uniform height, one line of what the flag grants. */
.tglhead{ font-family:var(--mono); font-size:10.5px; letter-spacing:.07em; color:var(--muted);
          text-transform:uppercase; margin:16px 0 0; }
.tgls{ display:grid; gap:0; margin:6px 0 0; border-top:1px solid var(--line-soft); }
.tgl{ display:flex; align-items:flex-start; gap:10px; padding:10px 2px;
      border-bottom:1px solid var(--line-soft); cursor:pointer; }
.tgl:hover{ background:var(--steel-2); }
.tgl input{ margin-top:3px; flex:0 0 auto; }
.tgl .tt{ font-size:13px; color:var(--silver); line-height:1.35; font-weight:400; }
.tgl .td{ display:block; font-family:var(--mono); font-size:10.5px; color:var(--muted); margin-top:3px; }
.dwacts{ margin-top:14px; }
/* Offboarding zone. Sits last and reads cold on purpose: red is the only place
   on this page it appears, so the control cannot be confused with a routine one. */
.danger{ border:1px solid rgba(255,92,92,.32); background:rgba(255,92,92,.03);
         padding:14px 16px; margin:26px 0 0; }
.danger .ptitle{ color:#ff7a7a; }
.dnbtn,.dngo{ background:transparent; border:1px solid rgba(255,92,92,.5); color:#ff7a7a;
  font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase;
  padding:9px 16px; cursor:pointer; transition:background .15s; }
.dnbtn:hover,.dngo:hover{ background:rgba(255,92,92,.1); }
.offbox{ display:none; margin-top:4px; }
.offbox.on{ display:block; }
.offbox textarea{ min-height:54px; width:100%; }
.frm textarea#dw_bio{ min-height:60px; }
#mback{ position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:210; display:none;
        align-items:flex-start; justify-content:center; overflow:auto; padding:40px 14px; }
.modal{ background:var(--black); border:1px solid var(--line); width:min(640px,100%); padding:20px 22px 26px; }
/* ---- forms / tabs / buttons ---- */
.frm{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; margin:10px 0; }
.frm label,.flabel{ display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.07em;
   text-transform:uppercase; color:var(--muted); margin:0 0 4px; }
.frm .wide{ grid-column:1 / -1; }
select{ width:100%; padding:10px 12px; background:var(--black); border:1px solid var(--line);
        color:var(--silver); font-family:var(--mono); font-size:13px; }
select:focus{ outline:none; border-color:var(--ore); }
.tabs{ display:flex; gap:8px; margin:0 0 14px; flex-wrap:wrap; }
.tab{ background:transparent; color:var(--silver-dim); border:1px solid var(--line); padding:6px 13px;
      cursor:pointer; font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
.tab:hover{ border-color:var(--ore); color:var(--ore); }
.tab.on{ background:var(--ore); color:#04140a; border-color:var(--ore); font-weight:700; }
button.dngr{ background:transparent; color:var(--red); border:1px solid rgba(240,129,122,.5); padding:6px 13px;
      cursor:pointer; font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
button.dngr:hover{ background:var(--red); color:#140404; }
button[disabled]{ opacity:.45; cursor:not-allowed; }
/* ---- code display / announce ---- */
.bigcode{ font-family:var(--mono); font-size:19px; color:var(--ore); letter-spacing:.14em;
          background:var(--black); border:1px solid var(--ore); padding:10px 16px; display:inline-block;
          user-select:all; word-break:break-all; }
.annc{ border:1px solid rgba(70,255,94,.5); background:var(--steel); padding:10px 12px; margin:10px 0;
       font-family:var(--mono); font-size:12px; line-height:1.55; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.hand{ font-family:var(--mono); font-size:12px; color:var(--silver-dim); background:var(--black);
       border:1px solid var(--line); padding:9px 12px; margin:8px 0; white-space:pre-wrap; word-break:break-word; }
/* ---- contract cards ---- */
.ccard{ background:var(--steel); border:1px solid var(--line-soft); padding:13px 15px; margin:0 0 12px; position:relative; }
.ccard::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--ore); opacity:.5; }
.ccard.rej::before{ background:var(--red); } .ccard.acc::before{ background:var(--ore); opacity:1; }
.chead{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.cnums{ display:flex; gap:22px; margin:9px 0 4px; font-family:var(--mono); flex-wrap:wrap; }
.cnums .k{ color:var(--muted); font-size:10px; letter-spacing:.07em; text-transform:uppercase; display:block; }
.cnums .v{ color:var(--ore); font-size:16px; font-variant-numeric:tabular-nums; }
.cnums .v.warn{ color:var(--amber); }
.rcpt{ background:var(--black); border:1px solid var(--line-soft); font-family:var(--mono); font-size:11.5px;
       color:var(--silver-dim); padding:9px 12px; margin:8px 0 2px; max-height:220px; overflow:auto; }
.rcpt .z{ color:var(--amber); }
details summary{ cursor:pointer; font-family:var(--mono); font-size:11px; letter-spacing:.05em;
                 text-transform:uppercase; color:var(--silver-dim); margin-top:6px; }
details summary:hover{ color:var(--ore); }
/* ---- event status chips ---- */
.evchip{ font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
         padding:2px 8px; border:1px solid var(--line); color:var(--muted); flex:0 0 auto; }
.evchip.active{ background:var(--ore); border-color:var(--ore); color:#04140a; font-weight:700; }
.evchip.ended{ background:var(--amber); border-color:var(--amber); color:#141004; font-weight:700; }
.evchip.awarded{ background:#ffd76a; border-color:#ffd76a; color:#141004; font-weight:700; }
/* ---- roster table extras ---- */
th.sortable{ cursor:pointer; user-select:none; }
th.sortable:hover{ color:var(--laser); }
tr.altrow td{ background:var(--black); color:var(--silver-dim); font-size:12.5px; }
td.tl{ text-align:left; }
.rowmeta{ font-family:var(--mono); font-size:10.5px; color:var(--muted); }
/* ---- medal compact grid ---- */
.medgrid.compact{ grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:10px; }
.medgrid.compact .med{ padding:11px 13px; }
.med.locked{ opacity:.45; } .med.locked::before{ background:var(--muted); }
.med .mtop{ display:flex; align-items:center; gap:9px; }
.med .mtop .ico{ font-size:20px; } .med .mtop .mname{ margin:0; font-size:13px; }
.med .mact{ margin-top:8px; display:flex; gap:6px; align-items:center; }
.prog{ height:5px; background:var(--black); border:1px solid var(--line-soft); margin-top:8px; }
.prog i{ display:block; height:100%; background:var(--ore-deep); }
/* ---- gate states ---- */
.state{ max-width:430px; margin:80px auto; text-align:center; padding:0 16px; }
.state h2{ font-family:var(--display); text-transform:uppercase; letter-spacing:.06em; color:var(--silver); font-size:18px; }
.state p{ font-family:var(--mono); font-size:12.5px; color:var(--muted); line-height:1.7; }
.footline{ color:var(--muted); font-family:var(--mono); font-size:11.5px; letter-spacing:.03em;
           margin:34px 0 0; border-top:1px solid var(--line); padding-top:16px; }
.footline b{ color:var(--silver-dim); }
pre.jsonp{ margin:0; font-family:var(--mono); font-size:11px; color:var(--silver-dim); white-space:pre-wrap;
           word-break:break-word; max-width:420px; text-align:left; }
.filterbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:0 0 12px; }
.filterbar input[type=text]{ width:220px; }
.filterbar .chk{ font-family:var(--mono); font-size:11px; color:var(--silver-dim); display:flex; gap:6px; align-items:center; }
.filterbar input[type=checkbox]{ width:auto; }
/* claim codes desk (bottom of Members) */
.codesec{ margin-top:22px; border-top:1px solid var(--line); padding-top:14px; }
.codetoggle{ background:transparent; border:1px solid var(--line); color:var(--silver-dim); cursor:pointer;
  font-family:var(--mono); font-size:12px; letter-spacing:.05em; padding:9px 14px; text-transform:uppercase; }
.codetoggle:hover{ border-color:var(--ore); color:var(--ore); }
.codetoggle .codehint{ color:var(--muted); text-transform:none; letter-spacing:0; margin-left:8px; }
.codegrp{ font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); margin:14px 0 4px; }
.coderow{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:9px 8px;
  border-top:1px solid var(--line-soft); font-size:12.5px; }
.coderow .codeign{ font-family:var(--display); font-weight:700; color:var(--silver); min-width:130px; }
.coderow .codebadge{ font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); border:1px solid var(--line); padding:2px 7px; }
.coderow .codeval{ font-family:var(--mono); font-size:12px; color:var(--ore); background:var(--black);
  border:1px solid var(--line); padding:2px 8px; }
.coderow .codeage{ font-family:var(--mono); font-size:11px; color:var(--muted); }
.coderow .codeacts{ margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; }
.codeok{ color:var(--ore); } .codewarn{ color:var(--amber); }
.inv.warn{ color:var(--red); border-color:rgba(240,129,122,.4); }
/* recruiting analytics */
.rtable{ width:100%; border-collapse:collapse; font-size:13px; }
.rtable th{ text-align:left; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding:6px 10px; border-bottom:1px solid var(--line); }
.rtable th.num, .rtable td.num{ text-align:right; }
.rtable td{ padding:7px 10px; border-top:1px solid var(--line-soft); color:var(--silver); }
.srcwrap{ display:flex; flex-wrap:wrap; gap:8px; }
.srcchip{ font-family:var(--mono); font-size:11.5px; color:var(--silver-dim); border:1px solid var(--line); padding:5px 10px; }
.srcchip b{ color:var(--ore); }

  /* suggestions queue */
  .sgrow{ border-top:1px solid var(--line-soft); padding:12px 0; }
  .sgrow:first-of-type{ border-top:0; }
  .sgtop{ display:flex; align-items:center; gap:10px; }
  .sgchip{ font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; padding:2px 8px; border:1px solid; text-transform:uppercase; }
  .sgOpen{ color:var(--amber); border-color:rgba(233,196,106,.45); }
  .sgNoted{ color:var(--silver-dim); border-color:var(--line); }
  .sgDone{ color:var(--ore); border-color:rgba(70,255,94,.45); }
  .sgDecl{ color:var(--muted); border-color:var(--line); }
  .sgwho{ font-family:var(--mono); font-size:10.5px; color:var(--muted); }
  .sgat{ font-family:var(--mono); font-size:10px; color:var(--muted); margin-left:auto; }
  .sgbody{ font-size:13.5px; color:var(--silver); line-height:1.6; margin-top:7px; white-space:pre-wrap; }
  .sgreply{ font-size:12.5px; color:var(--silver-dim); border-left:2px solid var(--ore); padding-left:9px; margin-top:7px; }
  .sgby{ font-family:var(--mono); font-size:9.5px; color:var(--muted); margin-top:5px; }
  .sgacts{ display:flex; gap:8px; margin-top:9px; flex-wrap:wrap; }
  .sgrep{ flex:1 1 260px; min-width:0; font-size:12.5px; padding:6px 9px; }
  .sgsel{ font-family:var(--mono); font-size:11px; padding:6px 8px; }
</style></head>
<body>
<div id="boot"><div class="wrap"><div class="skel sm" style="width:40%"></div><div class="skel lg"></div><div class="skel"></div></div></div>
<div id="stateout" class="state" style="display:none">
  <h2>Door is locked</h2>
  <p>You are not logged in. Leadership or not, everyone knocks.</p>
  <p><a href="/portal/">To the portal gate</a></p>
</div>
<div id="state403" class="state" style="display:none">
  <h2>Not your clearance</h2>
  <p>This room is for leadership, goblin. The belt misses you already.</p>
  <p><a href="/portal/">Back to your career page</a></p>
</div>
<div id="app" class="adminlay" style="display:none">
  <aside id="rail"></aside>
  <main id="main"></main>
</div>
<div id="dback"></div>
<div id="drawer"></div>
<div id="mback"></div>
<div id="toasts"></div>
<script>
"use strict";
/* ================= helpers ================= */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

function goblin(seed, size){
  let h=2166136261; const s=String(seed||"goblin");
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
  const rnd=()=>{ h^=h<<13; h>>>=0; h^=h>>>17; h^=h<<5; h>>>=0; return h/4294967296; };
  const hue=Math.floor(rnd()*360), c1="hsl("+hue+",70%,55%)", c2="hsl("+((hue+40)%360)+",80%,70%)";
  let cells="";
  for(let y=0;y<5;y++)for(let x=0;x<3;x++){ if(rnd()>0.45){ const f=rnd()>0.8?c2:c1;
    cells+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+f+'"/>';
    if(x<2) cells+='<rect x="'+(4-x)+'" y="'+y+'" width="1" height="1" fill="'+f+'"/>'; } }
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 -0.5 6 6" width="'+size+'" height="'+size+'" style="background:#0b0d0e">'+cells+'</svg>';
}
function avat(p, size, cls){
  const px=size||22, c="avm"+(cls?" "+cls:"");
  if(p && p.avatar_url) return '<span class="'+c+'"><img alt="" src="'+esc(p.avatar_url)+'" width="'+px+'" height="'+px+'"></span>';
  const seed=p&&(p.avatar_seed||p.main_ign||p.ign||p.name);
  return '<span class="'+c+'">'+goblin(seed,px)+'</span>';
}
function sig(x){ if(x>=100) return String(Math.round(x)); if(x>=10) return x.toFixed(1); return x.toFixed(2); }
function fmtIsk(n){
  n=Number(n); if(!isFinite(n)) return "0";
  const a=Math.abs(n), s=n<0?"−":"";
  if(a>=1e12) return s+sig(a/1e12)+"T";
  if(a>=1e9) return s+sig(a/1e9)+"B";
  if(a>=1e6) return s+sig(a/1e6)+"M";
  if(a>=1e3) return s+sig(a/1e3)+"k";
  return s+String(Math.round(a));
}
function fmtM3(n){ if(n==null||!isFinite(Number(n))) return null; return fmtIsk(n)+" m³"; }
function fmtN(n){ n=Number(n); return isFinite(n)?n.toLocaleString("en-US"):"0"; }
function ago(ts){
  if(!ts) return "never";
  let t=ts; if(typeof t==="number" && t<2e10) t=t*1000;
  const d=new Date(t); if(isNaN(d)) return String(ts);
  const s=(Date.now()-d.getTime())/1000;
  if(s<0) return "just now";
  if(s<3600) return Math.max(1,Math.round(s/60))+"m ago";
  if(s<86400) return Math.round(s/3600)+"h ago";
  return Math.round(s/86400)+"d ago";
}
function daysSince(ts){
  if(!ts) return Infinity;
  let t=ts; if(typeof t==="number" && t<2e10) t=t*1000;
  const d=new Date(t); if(isNaN(d)) return Infinity;
  return (Date.now()-d.getTime())/86400000;
}
function fmtDate(ts){
  if(!ts) return "unknown";
  let t=ts; if(typeof t==="number" && t<2e10) t=t*1000;
  const d=new Date(t); if(isNaN(d)) return String(ts);
  return d.toISOString().slice(0,10);
}
/* clipboard: registry keeps hostile text out of attributes */
const CP={}; let CPN=0;
function cp(text){ CPN++; CP["c"+CPN]=String(text); return "c"+CPN; }
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ toast("Copied. Go paste it, goblin."); },
      function(){ copyFallback(t); });
  } else copyFallback(t);
}
function copyFallback(t){
  const ta=document.createElement("textarea"); ta.value=t;
  ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("Copied. Go paste it, goblin."); }
  catch(e){ toast("Copy failed. Select it by hand.", true); }
  document.body.removeChild(ta);
}
document.addEventListener("click", function(e){
  const b=e.target.closest("[data-copy]");
  if(b){ copyText(CP[b.getAttribute("data-copy")]||""); }
});
function cpBtn(text, label){
  return '<button class="cmail" type="button" data-copy="'+cp(text)+'">'+esc(label||"Copy")+"</button>";
}
function toast(msg, bad){
  const t=document.createElement("div");
  t.className="toast"+(bad?" bad":""); t.textContent=String(msg);
  document.getElementById("toasts").appendChild(t);
  setTimeout(function(){ t.remove(); }, bad?8000:4000);
}
/* ================= api ================= */
const SILENT="__silent__";
async function api(path, body){
  const opt = body!==undefined
    ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)}
    : {};
  let r;
  try{ r=await fetch(path, opt); }
  catch(e){ throw new Error("The wire is down. Check your link and try again."); }
  if(r.status===401){ show("stateout"); throw new Error(SILENT); }
  let j=null; try{ j=await r.json(); }catch(e){}
  if(r.status===403) throw new Error((j&&j.error)||"Not your clearance, goblin.");
  if(!r.ok || !j || j.ok===false) throw new Error((j&&j.error)||"Something jammed in the machine. Try again.");
  return j;
}
function errToast(e){ if(e && e.message!==SILENT) toast(e.message, true); }
/* busy helper: disable a button while an async action runs */
async function busy(btn, fn){
  if(btn){ btn.disabled=true; var old=btn.textContent; btn.textContent="Working…"; }
  try{ await fn(); }
  catch(e){ errToast(e); }
  finally{ if(btn){ btn.disabled=false; btn.textContent=old; } }
}
/* ================= boot / state ================= */
let ME=null, ISADMIN=false, ROLE="member", PENDING_OPEN=null, CATALOG=null;
function show(id){
  ["boot","stateout","state403","app"].forEach(function(x){
    document.getElementById(x).style.display = (x===id) ? (x==="app"?"flex":"block") : "none";
  });
}
async function boot(){
  let j;
  try{ j=await api("/api/me"); }
  catch(e){
    if(e.message!==SILENT){ show("stateout");
      document.querySelector("#stateout p").textContent=e.message; }
    return;
  }
  ME=j; ROLE=(j.account&&j.account.role)||"member";
  ISADMIN=(ROLE==="admin");
  if(ROLE!=="admin" && ROLE!=="officer"){ show("state403"); return; }
  show("app"); renderRail(); route();
}
/* ================= router + rail ================= */
const NAVS=[
  ["","Command Center"],["books","The Books"],["members","Members"],["contracts","Contracts"],
  ["industry","Industry"],["recruiting","Recruiting"],["suggestions","Suggestions"],["events","Events"],
  ["decorations","Decorations"],["reconcile","Reconcile"],
  ["backfill","Backfill"],["audit","Audit"],["settings","Settings"]
];
function renderRail(){
  let h='<div class="rtitle">Command Center</div>'
       +'<div class="rsub">'+esc(ROLE)+' &middot; eyes of leadership</div>';
  NAVS.forEach(function(n){
    h+='<a class="rlink" id="rl_'+(n[0]||"home")+'" href="#'+n[0]+'">'+esc(n[1])+"</a>";
  });
  document.getElementById("rail").innerHTML=h;
}
function curSection(){ return location.hash.replace(/^#/,"").split("/")[0]; }
function route(){
  closeDrawer(); closeModal();
  const h=curSection();
  document.querySelectorAll(".rlink").forEach(function(a){ a.classList.remove("cur"); });
  const cur=document.getElementById("rl_"+(h||"home")); if(cur) cur.classList.add("cur");
  const fn=SECTIONS[h]||secOverview;
  fn();
  const m=document.getElementById("main"); if(m) m.focus && m.focus();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
function skel(n){
  let h=""; for(let i=0;i<(n||3);i++) h+='<div class="skel'+(i===0?" sm":"")+'"></div>';
  return h;
}
function head(title, sub){
  return '<div class="sechead">'+title+'</div><div class="secsub">'+sub+"</div>";
}
function napPanel(title, msg){
  return '<div class="panel"><div class="ptitle">'+esc(title)+'</div><div class="nap">'+esc(msg||"The ledger is napping. Numbers back soon.")+"</div></div>";
}
function footLine(){
  return '<div class="footline"><b>The ore must flow. The goblins must eat. 🪨🧊</b></div>';
}
/* drawer / modal plumbing */
function openDrawer(html){
  document.getElementById("drawer").innerHTML=html;
  document.getElementById("drawer").style.display="block";
  document.getElementById("dback").style.display="block";
  document.getElementById("drawer").scrollTop=0;
}
function closeDrawer(){
  document.getElementById("drawer").style.display="none";
  document.getElementById("dback").style.display="none";
}
document.getElementById("dback").addEventListener("click", closeDrawer);
function openModal(html){
  const mb=document.getElementById("mback");
  mb.innerHTML='<div class="modal">'+html+"</div>";
  mb.style.display="flex";
}
function closeModal(){ const mb=document.getElementById("mback"); mb.style.display="none"; mb.innerHTML=""; }
document.getElementById("mback").addEventListener("click", function(e){ if(e.target===this) closeModal(); });
document.addEventListener("keydown", function(e){ if(e.key==="Escape"){ closeModal(); closeDrawer(); } });
/* generic member id + name pulls (shapes are defensive on purpose) */
function accId(x){ return x==null?null:(x.account_id!=null?x.account_id:(x.id!=null?x.id:null)); }
function accName(x){ return x?(x.main_ign||x.ign||x.name||"unknown goblin"):"unknown goblin"; }
function announceBar(line, host){
  const id="an"+(++CPN);
  const div=document.createElement("div");
  div.className="annc";
  div.innerHTML='<span style="flex:1;min-width:200px">'+esc(line)+"</span>"
    +cpBtn(line,"Copy")
    +'<button class="inv" type="button" id="'+id+'">Announce</button>';
  host.prepend(div);
  div.querySelector("#"+id).addEventListener("click", function(){
    const b=this;
    busy(b, async function(){
      await api("/api/admin/announce",{text:line});
      toast("Announced. The wall grows.");
    });
  });
}
</script>
<script>
"use strict";
/* ================= 1. COMMAND CENTER ================= */
function tile(k, v, cls){
  return '<div class="tile"><div class="k">'+esc(k)+'</div><div class="v'+(cls?" "+cls:"")+'">'+v+"</div></div>";
}
function openMember(id){
  if(id==null) return;
  if(curSection()!=="members"){ PENDING_OPEN=id; location.hash="#members"; }
  else openMemberDrawer(id);
}
function whoSpan(x, extra){
  return '<span class="qwho" data-open="'+esc(String(accId(x)))+'">'+avat(x,22)+esc(accName(x))+"</span>"
    +(extra?' <span class="qmeta">'+extra+"</span>":"");
}
document.addEventListener("click", function(e){
  const w=e.target.closest("[data-open]");
  if(w){ openMember(w.getAttribute("data-open")); }
});
async function secOverview(){
  const m=document.getElementById("main");
  m.innerHTML=head("Command Center","how is the corp doing, and what needs you &middot; no clicks required")+skel(5);
  let j;
  try{ j=await api("/api/admin/overview"); }
  catch(e){
    if(e.message===SILENT) return;
    m.innerHTML=head("Command Center","how is the corp doing, and what needs you")
      +napPanel("Corp pulse", e.message)
      +'<button class="inv" onclick="secOverview()">Try again</button>'+footLine();
    return;
  }
  const p=j.pulse||{}, ny=j.needsYou||{}, bd=j.boards||{}, co=j.cohort||null;
  const ledgerDown = j.ledger && j.ledger.ok===false;
  const corp=p.corp||{};
  const corpIsk = corp.totalPayout!=null?corp.totalPayout:corp.isk;
  const corpM3  = corp.totalM3!=null?corp.totalM3:corp.m3;
  const corpOps = corp.fleetCount!=null?corp.fleetCount:corp.ops;
  let h=head("Command Center","how is the corp doing, and what needs you");
  /* pulse strip */
  h+='<div class="pulse">';
  h+=tile("Goblins", fmtN(p.members));
  h+=tile("Active this week", fmtN(p.activeThisWeek));
  h+=tile("Onboarded", p.onboardingRate!=null?Math.round(Number(p.onboardingRate)*(Number(p.onboardingRate)<=1?100:1))+"%":"…");
  if(ledgerDown){
    h+=tile("Corp ISK, lifetime", "napping", "dim")+tile("Corp rock moved", "napping", "dim")+tile("Corp ops", "napping", "dim");
  }else{
    h+=tile("Corp ISK, lifetime", corpIsk!=null?fmtIsk(corpIsk):"…");
    h+=tile("Corp rock moved", corpM3!=null?(fmtM3(corpM3)||"…"):"…");
    h+=tile("Corp ops", corpOps!=null?fmtN(corpOps):"…");
  }
  h+=tile("Treasury paid out", p.treasury!=null?fmtIsk(p.treasury):"napping", p.treasury!=null?"":"dim");
  h+=tile("Applications waiting", fmtN(p.pendingApplications), Number(p.pendingApplications)>0?"warn":"");
  h+=tile("Codes outstanding", fmtN(p.outstandingCodes), Number(p.outstandingCodes)>0?"warn":"");
  h+=tile("Contracts pending", fmtN(p.pendingContracts), Number(p.pendingContracts)>0?"warn":"");
  h+=tile("Industry pending", fmtN(p.pendingIndustry), Number(p.pendingIndustry)>0?"warn":"");
  h+="</div>";
  if(ledgerDown) h+='<div class="nap">The ledger is napping. Numbers back soon.</div>';
  /* corp goal */
  if(p.goal){
    const g=p.goal;
    let gcur="", gtgt="", glab="";
    if(g.metric==="fleet_isk"){ gcur=fmtIsk(g.current); gtgt=fmtIsk(g.target)+" ISK"; glab="ISK through buyback this month"; }
    else if(g.metric==="fleet_m3"){ gcur=fmtM3(g.current)||"0 m³"; gtgt=fmtM3(g.target)||"?"; glab="m³ hauled this month"; }
    else{ gcur=fmtN(g.current); gtgt=fmtN(g.target)+" units (in game ledger, raw)"; glab="units mined this month"; }
    let gp=Number(g.pct); if(!isFinite(gp)) gp=0; // contract: integer 0..100
    gp=Math.round(gp);
    const gw=Math.max(0, Math.min(100, gp));
    h+='<div class="panel"><div class="ptitle">Corp goal <span class="pn">'+esc(g.note||glab)+"</span></div>"
      +'<div style="display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;font-family:var(--mono)">'
      +'<span style="font-size:20px;color:var(--ore);font-variant-numeric:tabular-nums">'+gcur+"</span>"
      +'<span class="qmeta">of '+gtgt+"</span>"
      +'<span class="qmeta" style="margin-left:auto">'+gp+"%</span></div>"
      +'<div class="prog" style="margin-top:8px"><i style="width:'+gw+'%"></i></div>'
      +"</div>";
  }
  /* needs you */
  h+='<div class="panel"><div class="ptitle">Needs you <span class="pn">clear this and the corp hums</span></div><div id="nyq"></div></div>';
  /* cohort funnel */
  h+='<div class="panel"><div class="ptitle">The funnel <span class="pn">applied to still swinging the pick</span></div><div id="cohort"></div></div>';
  /* boards */
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px">'
    +'<div class="panel" style="margin:0"><div class="ptitle">Top haulers this month</div><div id="bd1"></div></div>'
    +'<div class="panel" style="margin:0"><div class="ptitle">Newest goblins</div><div id="bd2"></div></div>'
    +'<div class="panel" style="margin:0"><div class="ptitle">Longest tenure</div><div id="bd3"></div></div>'
    +"</div>";
  h+=footLine();
  m.innerHTML=h;
  renderNeedsYou(ny);
  renderCohort(co);
  renderBoard("bd1", bd.topMonth, function(r){ return '<span class="qval">'+fmtIsk(r.isk!=null?r.isk:(r.payout!=null?r.payout:r.lifetimeIsk))+"</span>"; },
    "No hauls this month yet. The belts are patient.");
  renderBoard("bd2", bd.newest, function(r){ return '<span class="qmeta">joined '+esc(fmtDate(r.tenure_start||r.joined||r.created_at))+"</span>"; },
    "No fresh goblins in 30 days. Feed the funnel.");
  renderBoard("bd3", bd.tenured, function(r){ return '<span class="qmeta">'+fmtN(r.tenure_days||r.days)+" days</span>"; },
    "Tenure records are quiet.");
}
function renderBoard(id, rows, valFn, empty){
  const el=document.getElementById(id); if(!el) return;
  if(!rows || !rows.length){ el.innerHTML='<div class="nap">'+esc(empty)+"</div>"; return; }
  let h="";
  rows.slice(0,8).forEach(function(r,i){
    h+='<div class="qrow"><span class="rank">'+(i+1)+"</span>"+whoSpan(r)
      +'<span class="qact">'+valFn(r)+"</span></div>";
  });
  el.innerHTML=h;
}
function renderCohort(co){
  const el=document.getElementById("cohort"); if(!el) return;
  if(!co){ el.innerHTML='<div class="nap">Funnel data is still warming up.</div>'; return; }
  const stages=[["applied","Applied"],["approved","Approved"],["claimed","Claimed"],
    ["onboarded","Onboarded"],["active30","Active 30d"],["active60","Active 60d"],["active90","Active 90d"]];
  let max=1; stages.forEach(function(s){ max=Math.max(max, Number(co[s[0]])||0); });
  let h='<div class="fun">';
  stages.forEach(function(s){
    const n=Number(co[s[0]])||0, w=Math.round(n/max*100);
    h+='<div class="frow"><span class="fk">'+esc(s[1])+'</span>'
      +'<span class="ft"><span class="fb" style="width:'+w+'%"></span></span>'
      +'<span class="fc">'+fmtN(n)+"</span></div>";
  });
  el.innerHTML=h+"</div>";
}
function renderNeedsYou(ny){
  const el=document.getElementById("nyq"); if(!el) return;
  let h="", any=false;
  (ny.contracts||[]).forEach(function(c){
    any=true;
    h+='<div class="qrow">'+whoSpan(c)
      +'<span class="qval">'+fmtIsk(c.payout!=null?c.payout:c.jita)+"</span>"
      +'<span class="qmeta">'+esc(ago(c.created_at||c.submitted_at))+"</span>"
      +'<span class="qact"><a class="link" href="#contracts">Review contract</a></span></div>';
  });
  (ny.applications||[]).forEach(function(a){
    any=true;
    h+='<div class="qrow"><span class="qwho">'+avat(a,22)+esc(a.ign||"applicant")+"</span>"
      +'<span class="qmeta">applied '+esc(ago(a.created_at))+"</span>"
      +'<span class="qact"><a class="link" href="#recruiting">Review application</a></span></div>';
  });
  (ny.industry||[]).forEach(function(c){
    any=true;
    h+='<div class="qrow">'+whoSpan(c)
      +'<span class="qval">'+fmtIsk(c.isk_value!=null?c.isk_value:c.isk)+"</span>"
      +'<span class="qmeta">'+esc(c.item_name||"industry contribution")+" &middot; "+esc(ago(c.submitted_at||c.created_at))+"</span>"
      +'<span class="qact"><a class="link" href="#industry">Review contribution</a></span></div>';
  });
  (ny.eventsToAward||[]).forEach(function(ev){
    any=true;
    h+='<div class="qrow"><span class="qwho" style="cursor:default">🏆 '+esc(ev.name||"event")+"</span>"
      +'<span class="qmeta">ended &middot; award the medal</span>'
      +'<span class="qact"><a class="link" href="#events">To the events desk</a></span></div>';
  });
  (ny.agingCodes||[]).forEach(function(c){
    any=true;
    const cid=c.code_id!=null?c.code_id:c.id;
    h+='<div class="qrow"><span class="qwho">'+esc(c.main_ign||c.code||"unclaimed code")+"</span>"
      +'<span class="qmeta">code minted '+esc(ago(c.created_at||c.minted_at))+", never redeemed</span>"
      +'<span class="qact"><button class="inv" data-handoff="'+esc(String(cid))+'">Mark handed off</button></span></div>';
  });
  (ny.quiet||[]).forEach(function(q){
    any=true;
    h+='<div class="qrow">'+whoSpan(q, "quiet since "+esc(ago(q.last_login||q.last_seen)))
      +'<span class="qact"><button class="inv" data-nudge="'+esc(String(accId(q)))+'">Nudge</button></span></div>';
  });
  (ny.noMedals||[]).forEach(function(q){
    any=true;
    h+='<div class="qrow">'+whoSpan(q, "onboarded, wall still bare")
      +'<span class="qact"><button class="inv" data-open="'+esc(String(accId(q)))+'">Pick a medal</button></span></div>';
  });
  const un=Number(ny.unmatchedLedgerNames)||0;
  if(un>0){
    any=true;
    h+='<div class="qrow"><span class="qwho">'+fmtN(un)+" ledger names unmatched</span>"
      +'<span class="qmeta">payout credited to nobody until you fix it</span>'
      +'<span class="qact"><a class="link" href="#reconcile">Reconcile</a></span></div>';
  }
  el.innerHTML = any?h:'<div class="nap">Queue is clear. The corp runs itself today. Go mine something.</div>';
  el.querySelectorAll("[data-handoff]").forEach(function(b){
    b.addEventListener("click", function(){
      const btn=this, id=btn.getAttribute("data-handoff");
      busy(btn, async function(){
        await api("/api/admin/codes/action",{code_id:isNaN(Number(id))?id:Number(id), action:"handoff"});
        toast("Marked handed off. Now chase the redeem.");
        secOverview();
      });
    });
  });
  el.querySelectorAll("[data-nudge]").forEach(function(b){
    b.addEventListener("click", function(){
      const btn=this, id=btn.getAttribute("data-nudge");
      busy(btn, async function(){
        const r=await api("/api/admin/nudge",{account_id:isNaN(Number(id))?id:Number(id)});
        const draft=r.dmDraft||r.draft||"";
        openModal('<div class="ptitle">Nudge draft</div>'
          +'<div class="hand">'+esc(draft)+"</div>"
          +cpBtn(draft,"Copy the DM")
          +' <button class="inv" onclick="closeModal()">Done</button>');
      });
    });
  });
}
</script>
<script>
"use strict";
/* ================= 2. MEMBERS ================= */
const MSTATE={rows:[], sort:"isk", dir:-1, q:"", quiet:false, open:{}};
function onbPct(m){
  if(m==null) return null;
  if(m.onboardingPct!=null) return Math.round(Number(m.onboardingPct)*(Number(m.onboardingPct)<=1?100:1));
  if(m.onboarding_pct!=null) return Math.round(Number(m.onboarding_pct)*(Number(m.onboarding_pct)<=1?100:1));
  const o=m.onboarding;
  if(o==null) return null;
  if(typeof o==="number") return Math.round(o*(o<=1?100:1));
  if(o.done && o.modules && o.modules.length) return Math.round(o.done.length/o.modules.length*100);
  if(o.done!=null && o.total) return Math.round(Number(o.done)/Number(o.total)*100);
  return null;
}
function medCount(m){
  const d=m.decorations;
  if(d==null) return 0;
  if(typeof d==="number") return d;
  if(Array.isArray(d)) return d.filter(function(x){ return x.earned!==false; }).length;
  return 0;
}
function mIsk(m){ return Number(m.lifetimeIsk!=null?m.lifetimeIsk:(m.stats&&m.stats.lifetimeIsk))||0; }
function mOps(m){
  // The members list nests fleet numbers under m.stats (opsAttended / opDrops),
  // NOT at the row root and NOT under stats.fleet (that shape is the roster's).
  const s=m.stats||{};
  const oa=m.opsAttended!=null?m.opsAttended:s.opsAttended;
  if(oa!=null) return {n:Number(oa)||0, label:"ops"};
  const od=m.opDrops!=null?m.opDrops:(s.opDrops!=null?s.opDrops:(s.fleet&&s.fleet.opDrops));
  return {n:Number(od)||0, label:"op drops"};
}
function mAlts(m){
  if(Array.isArray(m.characters)) return m.characters.filter(function(c){ return !c.is_main; });
  if(Array.isArray(m.alts)) return m.alts;
  return [];
}
function mVal(m, key){
  switch(key){
    case "ign": return accName(m).toLowerCase();
    case "role": return String(m.role||"").toLowerCase();
    case "tenure": return Number(m.tenure_days)||0;
    case "last": return -daysSince(m.last_login);
    case "onb": return onbPct(m)||0;
    case "meds": return medCount(m);
    case "isk": return mIsk(m);
    case "ops": return mOps(m).n;
    default: return 0;
  }
}

/* one chip per grantable flag. Filled = they hold it. Click toggles it, the row
   repaints from the server's answer, and the audit trail is written worker side. */
function accChip(id, kind, on, glyph, title){
  return '<button class="accchip'+(on?" on":"")+'" data-acc="'+esc(String(id))+'" data-kind="'+kind+'"'
    +' title="'+esc(title)+(on?" · click to revoke":" · click to grant")+'">'+glyph+'</button>';

async function accToggle(btn){
  const id=btn.getAttribute("data-acc"), kind=btn.getAttribute("data-kind");
  const on=!btn.classList.contains("on");
  btn.disabled=true;
  try{
    if(kind==="orca"||kind==="porpoise") await api("/api/admin/orca",{account_id:Number(id), on:on, hull:kind});
    else if(kind==="gobsec")             await api("/api/admin/gobsec-member",{account_id:Number(id), on:on});
    else if(kind==="gss")                await api("/api/admin/gss-clearance",{account_id:Number(id), on:on});
    btn.classList.toggle("on", on);
    const who=(MSTATE.rows.find(function(x){ return String(accId(x))===String(id); })||{});
    if(kind==="gss") who.gss_clearance=on?1:0; else who[kind]=on?1:0;
    toast((on?"Granted ":"Revoked ")+kind+".");
  }catch(e){ toast("That did not land: "+e.message, true); }
  btn.disabled=false;
}
function rosterFiltered(){
  const q=MSTATE.q.trim().toLowerCase();
  let rows=MSTATE.rows.filter(function(r){
    if(MSTATE.quiet && daysSince(r.last_login)<14) return false;
    if(!q) return true;
    if(accName(r).toLowerCase().indexOf(q)>=0) return true;
    let hit=false;
    (r.characters||[]).forEach(function(c){
      if(String(c.ign||"").toLowerCase().indexOf(q)>=0) hit=true;
      (c.aliases||[]).forEach(function(a){ if(String(a).toLowerCase().indexOf(q)>=0) hit=true; });
    });
    (r.aliases||[]).forEach(function(a){ if(String(a).toLowerCase().indexOf(q)>=0) hit=true; });
    return hit;
  });
  rows.sort(function(a,b){
    const va=mVal(a,MSTATE.sort), vb=mVal(b,MSTATE.sort);
    if(va<vb) return 1*MSTATE.dir*-1;
    if(va>vb) return -1*MSTATE.dir*-1;
    return 0;
  });
  return rows;
}

      +'<td class="acc">'
        +accChip(id,"orca",r.orca,"🐋","Orca · fleet rights")

          +"</td></tr>";
      });

    th.addEventListener("click", function(){

    b.addEventListener("click", function(ev){ ev.stopPropagation(); accToggle(b); });
  });
  t.querySelectorAll("[data-alts]").forEach(function(b){

      e.stopPropagation();

function csvCell(v){ v=String(v==null?"":v); return '"'+v.replace(/"/g,'""')+'"'; }
function exportRosterCsv(){
  const rows=rosterFiltered();
  let out="main_ign,role,tenure_days,last_login,onboarding_pct,medals,lifetime_isk,ops,ops_label,alts\n";
  rows.forEach(function(r){

    out+=[csvCell(accName(r)),csvCell(r.role||"member"),r.tenure_days||0,csvCell(r.last_login||""),
      onbPct(r)||0,medCount(r),mIsk(r),ops.n,csvCell(ops.label),
      csvCell(mAlts(r).map(function(c){return c.ign||c;}).join("; "))].join(",")+"\n";
  });
  downloadFile("bonk-roster.csv", out, "text/csv");
  toast("Roster exported. Guard it like ore.");
}
function downloadFile(name, content, type){
  const b=new Blob([content],{type:type||"text/plain"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

    +'<div class="dwacts"><button class="inv" id="dw_save">Save identity</button> '
    +'<button class="cmail" id="dw_viewas">View as member</button></div></div>';
  /* characters */
  h+='<div class="panel"><div class="ptitle">Characters <span class="pn">one main, one payout, the rest grind</span></div><div id="dw_chars">';
  if(!chars.length) h+='<div class="nap">No characters on file. That is a ghost, not a goblin.</div>';
  chars.forEach(function(c){
    h+='<div class="qrow">'+avat(c,22)+'<span class="qwho" style="cursor:default">'+esc(c.ign)+"</span>"
      +(c.is_main?' <span class="badge">MAIN</span>':"")
      +(c.is_payout?' <span class="badge">PAYOUT</span>':"")
      +(c.active===false?' <span class="rowmeta">retired</span>':"")
      +'<span class="qact">'
      +(!c.is_main?'<button class="cmail" data-chact="set-main" data-cid="'+esc(String(c.id))+'">Set main</button>':"")
      +(!c.is_payout?'<button class="cmail" data-chact="set-payout" data-cid="'+esc(String(c.id))+'">Set payout</button>':"")
      +'<button class="cmail" data-chact="rename" data-cid="'+esc(String(c.id))+'">Rename</button>'
      +(!c.is_main && c.active!==false?'<button class="cmail" data-chact="retire" data-cid="'+esc(String(c.id))+'">Retire</button>':"")
      +"</span></div>";
  });
  h+='</div><div style="display:flex;gap:8px;margin-top:10px"><input id="dw_newalt" placeholder="new alt IGN" style="max-width:220px">'
    +'<button class="inv" id="dw_addalt">Add alt</button></div></div>';
  /* decorations */
  h+='<div class="panel"><div class="ptitle">The wall <span class="pn">earned bright, locked grey</span></div><div class="medgrid compact">';
  if(!decs.length) h+='<div class="nap">Catalog did not load. The wall will be back.</div>';
  decs.forEach(function(d){
    const earned=!!d.earned;
    h+='<div class="med'+(earned?"":" locked")+(d.tier!=null&&Number(d.tier)<=4?" honor":"")+'">'
      +'<div class="mtop"><span class="ico">'+esc(d.emoji||"🎖")+'</span><span class="mname">'+esc(d.name)+"</span></div>";
    if(earned){
      h+='<div class="rowmeta" style="margin-top:6px">'+esc(d.awarded_at?("awarded "+fmtDate(d.awarded_at)):"earned")
        +(d.awarded_by?(" by "+esc(d.awarded_by)):"")+"</div>"
        +(d.note?'<div class="rowmeta">note: '+esc(d.note)+"</div>":"")
        +'<div class="mact"><button class="dngr" data-rescind="'+esc(d.key)+'">Rescind ✕</button></div>';
    }else{
      if(d.progress && d.progress.threshold){
        const pc=Math.min(100, Math.round(Number(d.progress.current)/Number(d.progress.threshold)*100));
        h+='<div class="prog"><i style="width:'+pc+'%"></i></div>'
          +'<div class="rowmeta">'+fmtIsk(d.progress.current)+" / "+fmtIsk(d.progress.threshold)+" &middot; "+pc+"%</div>";
      }else if(d.description){
        h+='<div class="rowmeta" style="margin-top:6px">LOCKED &middot; '+esc(d.description)+"</div>";
      }
      h+='<div class="mact"><button class="inv" data-award="'+esc(d.key)+'">Award</button></div>';
    }
    h+="</div>";
  });
  h+="</div></div>";
  /* contracts mini queue */
  h+='<div class="panel"><div class="ptitle">Solo contracts</div><div id="dw_contracts">';
  if(!contracts.length) h+='<div class="nap">No solo contracts yet. The belts await.</div>';
  contracts.forEach(function(c){
    const pend=(c.status||"")==="pending";
    h+='<div class="qrow"><span class="qval">'+fmtIsk(c.payout!=null?c.payout:c.jita)+"</span>"
      +'<span class="qmeta">'+esc(c.status||"?")+" &middot; "+esc(ago(c.created_at))+"</span>"
      +(Number(c.unmatched)>0?'<span class="warn qmeta">'+fmtN(c.unmatched)+" unpriced</span>":"")
      +(pend?'<span class="qact"><button class="inv" data-cacc="'+esc(String(c.id))+'">Accept</button>'
        +'<button class="dngr" data-crej="'+esc(String(c.id))+'">Reject</button></span>':"")
      +"</div>";
  });
  h+='</div><div class="rowmeta" style="margin-top:8px">For overrides on unpriced ore, use the Contracts room.</div></div>';
  /* ledger names */
  h+='<div class="panel"><div class="ptitle">Ledger names</div>';
  h+='<div class="rowmeta" style="margin-bottom:6px">Matched: '
    +(matched.length?esc(matched.map(function(x){return x.ledger_name||x.name||x;}).join(", ")):"none yet")+"</div>";
  if(sugg.length){
    sugg.forEach(function(s){
      const cid=s.character_id!=null?s.character_id:(main.id);
      h+='<div class="qrow"><span class="qwho" style="cursor:default">'+esc(s.ledger_name||s.name)+"</span>"
        +(s.candidate?'<span class="qmeta">looks like '+esc(s.candidate)+"</span>":"")
        +'<span class="qact"><button class="inv" data-attach="'+esc(String(s.ledger_name||s.name))+'" data-attachcid="'+esc(String(cid))+'">Attach</button></span></div>';
    });
  }else{
    h+='<div class="nap">Every name on this goblin is matched. Clean books.</div>';
  }
  h+="</div>";
  /* onboarding */
  const mods=onb.modules||["welcome","fleet_ops","doctrine","tools","payday","medals"];
  const done=onb.done||[];
  h+='<div class="panel"><div class="ptitle">Academy</div>';
  mods.forEach(function(k){
    const key=k.key||k, name=k.name||String(k).replace(/_/g," ");
    const isDone=done.indexOf(key)>=0 || (k.done===true);
    h+='<label class="chk" style="display:flex;padding:4px 0"><input type="checkbox" class="dw_onb" value="'+esc(key)+'"'+(isDone?" checked":"")+"> "+esc(name)+"</label>";
  });
  h+="</div>";
  /* officer notes */
  h+='<div class="panel"><div class="ptitle">Officer notes <span class="pn">leadership eyes only</span></div><div id="dw_notes">';
  if(!notes.length) h+='<div class="nap">No notes. Write down why this goblin matters.</div>';
  notes.forEach(function(n){
    h+='<div class="qrow"><span style="flex:1;min-width:180px">'+esc(n.note||n.body||n.text||"")+"</span>"
      +'<span class="qmeta">'+esc(n.actor||n.author||"")+" &middot; "+esc(ago(n.created_at))+"</span></div>";
  });
  h+='</div><div style="display:flex;gap:8px;margin-top:10px"><input id="dw_note" placeholder="add a note" style="flex:1">'
    +'<button class="inv" id="dw_addnote">Add</button></div></div>';
  /* danger zone */
  if(ISADMIN){
    h+='<div class="panel" style="border-color:rgba(240,129,122,.4)"><div class="ptitle" style="color:var(--red)">Danger zone</div>'
      +'<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">'
      +'<button class="dngr" id="dw_reset">Mint password reset</button>'
      +'<button class="dngr" id="dw_deact">Deactivate</button>'
      +'<label class="chk"><input type="checkbox" id="dw_purge"> also purge everything. Characters, avatars, history. This is the airlock. There is no undo.</label>'
      +'</div><div id="dw_danger_out"></div></div>';
  }
  /* OFF THE BOOKS. Deliberately last, in its own zone, nowhere near Save
     identity — a destructive control next to a routine one gets misclicked.
     Two steps: the reason picker is hidden until asked for, and confirming
     names the goblin out loud so nobody fires the wrong row. Admin only,
     matching the endpoint, so officers never see a button they cannot use. */
  if(ISADMIN){
    const gone=(a.status&&a.status!=="active");
    h+='<div class="danger"><div class="ptitle">'+(gone?"Off the books":"Ending it")
      +' <span class="pn">'+(gone?"reinstating puts them straight back on the roster"
        :"deactivates the account, never deletes it &middot; their ISK history stays")+'</span></div>';
    if(gone){
      h+='<div class="nap" style="margin:0 0 10px">This goblin is off the books. They cannot log in and they are off every roster.</div>'
        +'<button class="dngo" id="dw_reinstate">Put '+esc(displayName)+' back on</button>';
    }else{
      h+='<button class="dnbtn" id="dw_off">Take '+esc(displayName)+' off the books</button>'
        +'<div id="dw_offbox" class="offbox">'
        +'<div class="tglhead">Why</div><div class="tgls">'
        +[["quit","They quit","left of their own accord"],
          ["fired","Removed","we let them go"],
          ["inactive","Gone quiet","never came back, no drama"]].map(function(r){
            return '<label class="tgl"><input type="radio" name="dw_why" value="'+r[0]+'">'
              +'<span class="tt">'+r[1]+'<span class="td">'+r[2]+'</span></span></label>'; }).join("")
        +'</div>'
        +'<label class="flabel" style="margin-top:12px">What happened <span class="pn">optional, but this is how we learn</span></label>'
        +'<textarea id="dw_offnote" placeholder="one line. future you will want this."></textarea>'
        +'<div class="dwacts"><button class="dngo" id="dw_offgo">Confirm</button> '
        +'<button class="cmail" id="dw_offno">Cancel</button></div></div>';
    }
    h+="</div>";
  }
  openDrawer(h);
  wireDrawer(aid, chars, main);
  wireOffboard(aid, displayName);
}

/* The offboard control. Kept out of wireDrawer so the destructive path is one
   readable block rather than another branch in a 200-line wiring function. */
function wireOffboard(aid, displayName){
  const D=document.getElementById("drawer");
  const open=D.querySelector("#dw_off"), box=D.querySelector("#dw_offbox");
  if(open&&box){
    open.addEventListener("click",function(){ box.classList.add("on"); open.style.display="none"; });
    D.querySelector("#dw_offno").addEventListener("click",function(){
      box.classList.remove("on"); open.style.display=""; });
    D.querySelector("#dw_offgo").addEventListener("click",function(){
      const why=D.querySelector('input[name="dw_why"]:checked');
      if(!why){ toast("Pick a reason first"); return; }
      const btn=D.querySelector("#dw_offgo");
      busy(btn, async function(){
        await api("/api/admin/member-status",{method:"POST",body:JSON.stringify({
          account_id:aid, status:"deactivated", reason:why.value,
          note:(D.querySelector("#dw_offnote").value||"").slice(0,300) })});
        toast(displayName+" is off the books");
        openMemberDrawer(aid);            // repaint: the zone flips to Reinstate
        if(typeof loadSection==="function") loadSection();
      });
    });
  }
  const back=D.querySelector("#dw_reinstate");
  if(back) back.addEventListener("click",function(){
    busy(back, async function(){
      await api("/api/admin/member-status",{method:"POST",body:JSON.stringify({
        account_id:aid, status:"active", reason:"rejoined" })});
      toast(displayName+" is back on");
      openMemberDrawer(aid);
      if(typeof loadSection==="function") loadSection();
    });
  });
}
function wireDrawer(aid, chars, main){
  const D=document.getElementById("drawer");
  const q=function(s){ return D.querySelector(s); };
  q("#dw_save").addEventListener("click", function(){
    const btn=this;
    busy(btn, async function(){
      const body={ discord_handle:q("#dw_dc").value.trim() };
      const ten=q("#dw_ten").value; if(ten) body.tenure_start=ten;
      body.timezone=q("#dw_tz").value.trim();
      body.bio=q("#dw_bio").value;
      await api("/api/admin/members/"+encodeURIComponent(aid)+"/profile", body);
      // Only touch role when it actually changed, so a save can never silently
      // re-role a goblin off a stale/defaulted dropdown value.
      var rs=q("#dw_role");
      if(ISADMIN && rs && rs.value!==rs.getAttribute("data-orig")){
        await api("/api/admin/role",{account_id:aid, role:rs.value});
      }
      var gc=q("#dw_gss");
      if(ISADMIN && gc && (gc.checked?"1":"0")!==gc.getAttribute("data-orig")){
        await api("/api/admin/gss-clearance",{account_id:aid, on:gc.checked});
      }
      // Orca program flags are an OFFICER lever by design (program, not role).
      var oc=q("#dw_orca");
      if(oc && (oc.checked?"1":"0")!==oc.getAttribute("data-orig")){
        await api("/api/admin/orca",{account_id:aid, on:oc.checked, hull:"orca"});
      }
      var pc=q("#dw_porp");
      if(pc && (pc.checked?"1":"0")!==pc.getAttribute("data-orig")){
        await api("/api/admin/orca",{account_id:aid, on:pc.checked, hull:"porpoise"});
      }
      // GOBSEC membership: the wall's door, officer lever
      var gb=q("#dw_gobsec");
      if(gb && (gb.checked?"1":"0")!==gb.getAttribute("data-orig")){
        await api("/api/admin/gobsec-member",{account_id:aid, on:gb.checked});
      }
      toast("Saved. The record stands.");
      openMemberDrawer(aid);
    });
  });
  q("#dw_viewas").addEventListener("click", function(){
    const btn=this;
    busy(btn, async function(){
      const r=await api("/api/admin/members/"+encodeURIComponent(aid)+"/as-member");
      const st=r.stats||{}, ds=r.decorations||[], ob=r.onboarding||{};
      const earned=ds.filter(function(d){return d.earned;}).length;
      const pct=(ob.done&&ob.modules&&ob.modules.length)?Math.round(ob.done.length/ob.modules.length*100):(ob.complete?100:null);
      openModal('<div class="ptitle">Through their eyes <span class="pn">read only &middot; exactly what they see</span></div>'
        +'<div class="pulse" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">'
        +tile("ISK earned", st.lifetimeIsk!=null?fmtIsk(st.lifetimeIsk):"napping")
        +tile("Medals", earned+" / "+ds.length)
        +tile("Academy", pct==null?"…":pct+"%")
        +tile("Days in corp", fmtN(r.account&&r.account.tenure_days))
        +"</div>"
        +'<div class="rowmeta">If this looks wrong to you, it looks wrong to them. Fix it here.</div>'
        +'<div style="margin-top:12px"><button class="inv" onclick="closeModal()">Done</button></div>');
    });
  });
  D.querySelectorAll("[data-chact]").forEach(function(b){
    b.addEventListener("click", function(){
      const btn=this, act=btn.getAttribute("data-chact"), cid=btn.getAttribute("data-cid");
      busy(btn, async function(){
        const body={ action:act, character_id:isNaN(Number(cid))?cid:Number(cid) };
        if(act==="rename"){
          const nn=prompt("New IGN for this character:"); if(!nn) return;
          body.ign=nn.trim();
        }
        if(act==="retire" && !confirm("Retire this character? Its history stays on the books.")) return;
        await api("/api/admin/members/"+encodeURIComponent(aid)+"/characters", body);
        toast("Done. The roster remembers.");
        openMemberDrawer(aid);
      });
    });
  });
  q("#dw_addalt").addEventListener("click", function(){
    const btn=this;
    busy(btn, async function(){
      const ign=q("#dw_newalt").value.trim();
      if(!ign){ toast("An alt needs a name.", true); return; }
      await api("/api/admin/members/"+encodeURIComponent(aid)+"/characters",{action:"add", ign:ign});
      toast("Alt added. More hands on the rock.");
      openMemberDrawer(aid);
    });
  });
  D.querySelectorAll("[data-award]").forEach(function(b){
    b.addEventListener("click", function(){
      const btn=this, key=btn.getAttribute("data-award");
      busy(btn, async function(){
        const note=prompt("Note for the award (optional, shows on their shelf):")||"";
        const r=await api("/api/admin/award",{account_id:aid, decoration_key:key, note:note});
        toast("Awarded. The wall grows.");
        openMemberDrawer(aid).then(function(){
          if(r.announce) announceBar(r.announce, document.getElementById("dw_annc"));
        });
      });
    });
  });
  D.querySelectorAll("[data-rescind]").forEach(function(b){
    b.addEventListener("click", function(){
      const btn=this, key=btn.getAttribute("data-rescind");
      busy(btn, async function(){
        if(!confirm("Rescind this medal? It comes off the shelf.")) return;
        await api("/api/admin/rescind",{account_id:aid, decoration_key:key});
        toast("Rescinded. The wall shrinks.");
        openMemberDrawer(aid);
      });
    });
  });
  D.querySelectorAll("[data-cacc]").forEach(function(b){
    b.addEventListener("click", function(){
      const btn=this, id=btn.getAttribute("data-cacc");
      busy(btn, async function(){
        const r=await api("/api/admin/contracts/"+encodeURIComponent(id)+"/review",{action:"accept"});
        toast("Accepted. The number climbs.");
        openMemberDrawer(aid).then(function(){
          if(r.announce) announceBar(r.announce, document.getElementById("dw_annc"));
        });
      });
    });
  });
  D.querySelectorAll("[data-crej]").forEach(function(b){
    b.addEventListener("click", function(){
      const btn=this, id=btn.getAttribute("data-crej");
      busy(btn, async function(){
        const why=prompt("Reason for the reject (the member sees this):"); if(why==null) return;
        await api("/api/admin/contracts/"+encodeURIComponent(id)+"/review",{action:"reject", note:why});
        toast("Rejected. Honesty keeps the books clean.");
        openMemberDrawer(aid);
      });
    });
  });
  D.querySelectorAll("[data-attach]").forEach(function(b){
    b.addEventListener("click", function(){
      const btn=this, name=btn.getAttribute("data-attach"), cid=btn.getAttribute("data-attachcid");
      busy(btn, async function(){
        await api("/api/admin/aliases",{character_id:isNaN(Number(cid))?cid:Number(cid), ledger_name:name});
        toast("Attached. Their number just got honest.");
        openMemberDrawer(aid);
      });
    });
  });
  D.querySelectorAll(".dw_onb").forEach(function(c){
    c.addEventListener("change", function(){
      const cb=this;
      busy(null, async function(){
        await api("/api/admin/onboarding",{account_id:aid, module_key:cb.value, done:cb.checked});
        toast(cb.checked?"Module marked. They are learning to fly the right way.":"Module reset.");
      });
    });
  });
  q("#dw_addnote").addEventListener("click", function(){
    const btn=this;
    busy(btn, async function(){
      const n=q("#dw_note").value.trim();
      if(!n){ toast("An empty note helps nobody.", true); return; }
      await api("/api/admin/notes",{account_id:aid, note:n});
      toast("Noted.");
      openMemberDrawer(aid);
    });
  });
  if(ISADMIN){
    q("#dw_reset").addEventListener("click", function(){
      const btn=this;
      busy(btn, async function(){
        if(!confirm("Mint a single use password reset code? Their current sessions all die.")) return;
        const r=await api("/api/admin/reset-password",{account_id:aid});
        const code=r.code||"", hand=r.handoff||("Your BONK reset code: "+code);
        q("#dw_danger_out").innerHTML='<div style="margin:12px 0 6px"><span class="bigcode">'+esc(code)+"</span></div>"
          +'<div class="hand">'+esc(hand)+"</div>"+cpBtn("https://bonkeve.com/portal/claim?code="+code,"Copy link")+" "+cpBtn(code,"Copy code")+" "+cpBtn(hand,"Copy handoff DM");
        toast("Reset minted. Hand it to them yourself.");
      });
    });
    q("#dw_deact").addEventListener("click", function(){
      const btn=this;
      busy(btn, async function(){
        const purge=q("#dw_purge").checked;
        const warn=purge
          ? "PURGE this account? Characters, avatars, history, all of it, gone for good. Type the airlock open?"
          : "Deactivate this account? Sessions die, roster hides them, history stays.";
        if(!confirm(warn)) return;
        if(purge && !confirm("Last chance. Purge is forever.")) return;
        await api("/api/admin/deactivate",{account_id:aid, purge:purge});
        toast(purge?"Purged. The void has them now.":"Deactivated. The books remember.");
        closeDrawer(); secMembers();
      });
    });
  }
}
</script>
<script>
"use strict";
/* ================= 3. CONTRACTS ================= */
const CSTATE={tab:"pending", bulk:false, sel:{}};
async function secContracts(){
  const m=document.getElementById("main");
  m.innerHTML=head("Contracts","the honesty gate &middot; nothing counts until leadership says it counts")+skel(4);
  let j;
  try{ j=await api("/api/admin/contracts?status="+encodeURIComponent(CSTATE.tab)); }
  catch(e){
    if(e.message===SILENT) return;
    m.innerHTML=head("Contracts","the honesty gate")+napPanel("Contract queue", e.message)
      +'<button class="inv" onclick="secContracts()">Try again</button>';
    return;
  }
  const list=j.contracts||[];
  let h=head("Contracts","the honesty gate &middot; nothing counts until leadership says it counts");
  h+='<div class="tabs">';
  ["pending","accepted","rejected","all"].forEach(function(t){
    h+='<button class="tab'+(CSTATE.tab===t?" on":"")+'" data-ctab="'+t+'">'+t+"</button>";
  });
  if(CSTATE.tab==="pending"){
    h+='<button class="tab'+(CSTATE.bulk?" on":"")+'" id="cbulk" style="margin-left:auto">Bulk accept mode</button>';
  }
  h+="</div>";
  h+='<div id="c_annc"></div><div id="clist">';
  if(!list.length){
    h+='<div class="empty">'+(CSTATE.tab==="pending"
      ?"Queue is empty. Every haul is counted. The goblins are fed."
      :"Nothing in this pile.")+"</div>";
  }
  list.forEach(function(c){
    const un=Number(c.unmatched)||0;
    const detail=c.detail||[];
    const unl=detail.filter(function(l){ return !Number(l[2]); });
    h+='<div class="ccard'+(c.status==="rejected"?" rej":(c.status==="accepted"?" acc":""))+'">'
      +'<div class="chead">'
      +(CSTATE.bulk && c.status==="pending"?'<input type="checkbox" class="csel" value="'+esc(String(c.id))+'" style="width:auto">':"")
      +whoSpan(c, c.ign && c.ign!==accName(c)?("via "+esc(c.ign)):"")
      +'<span class="qmeta">'+esc(ago(c.created_at))+" &middot; "+fmtN(c.line_count)+" lines &middot; status "+esc(c.status||"?")+"</span>"
      +"</div>";
    h+='<div class="cnums">'
      +'<span><span class="k">Jita value</span><span class="v">'+fmtIsk(c.jita)+"</span></span>"
      +'<span><span class="k">Payout</span><span class="v">'+fmtIsk(c.payout)+"</span></span>"
      +'<span><span class="k">Volume</span><span class="v">'+(fmtM3(c.m3)||"…")+"</span></span>"
      +'<span><span class="k">Matched</span><span class="v">'+fmtN((Number(c.line_count)||0)-un)+"</span></span>"
      +'<span><span class="k">Unmatched</span><span class="v'+(un>0?" warn":"")+'">'+fmtN(un)+"</span></span>"
      +"</div>";
    if(un>0){
      h+='<details><summary class="warn">'+fmtN(un)+' unpriced lines &middot; the market does not know this ore</summary><div class="rcpt">';
      if(unl.length) unl.forEach(function(l){ h+='<div class="z">'+esc(l[0])+" × "+fmtN(l[1])+" &middot; no price</div>"; });
      else h+='<div class="z">Line detail unavailable here. The receipt knows.</div>';
      h+="</div></details>";
    }
    if(detail.length){
      h+='<details><summary>Raw receipt</summary><div class="rcpt">';
      detail.forEach(function(l){
        h+='<div'+(!Number(l[2])?' class="z"':"")+">"+esc(l[0])+" × "+fmtN(l[1])+" &middot; "+fmtIsk(l[2])+"</div>";
      });
      h+="</div></details>";
    }
    if(c.status==="pending"){
      h+='<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center">';
      if(un>0){
        h+='<input type="number" class="c_ovj" data-for="'+esc(String(c.id))+'" placeholder="override Jita ISK" style="max-width:170px">'
          +'<input type="number" class="c_ovm" data-for="'+esc(String(c.id))+'" placeholder="override m³" style="max-width:140px">';
      }
      h+='<button class="inv" data-acc="'+esc(String(c.id))+'" data-un="'+un+'">Accept</button>'
        +'<button class="dngr" data-rej="'+esc(String(c.id))+'">Reject</button></div>';
    }
    if(c.status==="rejected" && c.note) h+='<div class="rowmeta" style="margin-top:6px">reason: '+esc(c.note)+"</div>";
    h+="</div>";
  });
  h+="</div>";
  if(CSTATE.bulk && CSTATE.tab==="pending" && list.length){
    h+='<button class="gobtn" id="cbulkgo">Accept every checked contract</button>';
  }
  h+=footLine();
  m.innerHTML=h;
  m.querySelectorAll("[data-ctab]").forEach(function(b){
    b.addEventListener("click", function(){ CSTATE.tab=this.getAttribute("data-ctab"); CSTATE.bulk=false; secContracts(); });
  });
  const cb=document.getElementById("cbulk");
  if(cb) cb.addEventListener("click", function(){ CSTATE.bulk=!CSTATE.bulk; secContracts(); });
  m.querySelectorAll("[data-acc]").forEach(function(b){
    b.addEventListener("click", function(){
      const btn=this, id=btn.getAttribute("data-acc"), un=Number(btn.getAttribute("data-un"))||0;
      busy(btn, async function(){
        const body={action:"accept"};
        if(un>0){
          const oj=document.querySelector('.c_ovj[data-for="'+id+'"]');
          const om=document.querySelector('.c_ovm[data-for="'+id+'"]');
          const ov={};
          if(oj && oj.value!=="") ov.jita=Number(oj.value);
          if(om && om.value!=="") ov.m3=Number(om.value);
          if(ov.jita!=null || ov.m3!=null) body.override=ov;
        }
        const r=await api("/api/admin/contracts/"+encodeURIComponent(id)+"/review", body);
        toast("Accepted. Their number climbs tonight.");
        await secContracts();
        if(r.announce) announceBar(r.announce, document.getElementById("c_annc"));
      });
    });
  });
  m.querySelectorAll("[data-rej]").forEach(function(b){
    b.addEventListener("click", function(){
      const btn=this, id=btn.getAttribute("data-rej");
      busy(btn, async function(){
        const why=prompt("Reason for the reject (the member sees this):"); if(why==null) return;
        await api("/api/admin/contracts/"+encodeURIComponent(id)+"/review",{action:"reject", note:why});
        toast("Rejected. The books stay honest.");
        secContracts();
      });
    });
  });
  const bg=document.getElementById("cbulkgo");
  if(bg) bg.addEventListener("click", function(){
    const btn=this;
    busy(btn, async function(){
      const ids=[].slice.call(document.querySelectorAll(".csel:checked")).map(function(c){return c.value;});
      if(!ids.length){ toast("Check some contracts first, chief.", true); return; }
      if(!confirm("Accept "+ids.length+" contracts? Only do this for a batch you trust.")) return;
      let ok=0, fail=0;
      for(const id of ids){
        try{ await api("/api/admin/contracts/"+encodeURIComponent(id)+"/review",{action:"accept"}); ok++; }
        catch(e){ fail++; if(e.message!==SILENT) toast(e.message, true); }
      }
      toast(ok+" accepted"+(fail?(", "+fail+" jammed"):"")+". The ore flows.");
      secContracts();
    });
  });
}

}
function wireRecTabs(m){

async function secRecruiting(){
  const m=document.getElementById("main");
  if(RSTATE.tab==="analytics") return secRecruitingStats();
  m.innerHTML=head("Recruiting","the pipeline &middot; from knock on the door to goblin at the table")+skel(4);
  let j;
  try{ j=await api("/api/admin/applications?status="+encodeURIComponent(RSTATE.tab)); }
  catch(e){
    if(e.message===SILENT) return;
    m.innerHTML=head("Recruiting","the pipeline")+napPanel("Applications", e.message)
      +'<button class="inv" onclick="secRecruiting()">Try again</button>';
    return;
  }
  const list=j.applications||[];
  let h=head("Recruiting","the pipeline &middot; from knock on the door to goblin at the table");
  h+=recTabs(RSTATE.tab);
  if(!list.length){
    h+='<div class="empty">'+(RSTATE.tab==="pending"
      ?"No applications waiting. Go rattle the recruitment drum."
      :"Nothing in this pile.")+"</div>";
  }
  list.forEach(function(a){
    const id=a.id;
    h+='<div class="ccard"><div class="chead">'
      +'<span class="qwho" style="cursor:default">'+avat(a,22)+"<b>"+esc(a.ign||"no IGN given")+"</b></span>"
      +'<span class="qmeta">applied '+esc(ago(a.created_at))+" &middot; status "+esc(a.status||"?")+"</span></div>";
    const fields=[["timezone","Timezone"],["experience","Experience"],["ships","Ships"],
      ["looking_for","Looking for"],["found_us","Found us via"],["contact","Reach them at"],["notes","Notes"]];
    h+='<div class="frm" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">';
    fields.forEach(function(f){
      const v=a[f[0]];
      if(v==null||v==="") return;
      h+='<div><span class="flabel">'+esc(f[1])+"</span><span>"+esc(Array.isArray(v)?v.join(", "):v)+"</span></div>";
    });
    if(Array.isArray(a.activities)&&a.activities.length)
      h+='<div><span class="flabel">Into</span><span>'+esc(a.activities.join(", "))+"</span></div>";
    h+="</div>";
    if(a.review_note||a.note) h+='<div class="rowmeta">note: '+esc(a.review_note||a.note)+"</div>";
    h+='<div id="r_out_'+esc(String(id))+'"></div>';
    if(a.status==="pending"){
      h+='<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center">'
        +'<span class="flabel" style="margin:0">Recruited by</span>'
        +'<select class="rref" data-for="'+esc(String(id))+'" style="width:auto;min-width:170px"><option value="">nobody / unknown</option></select>'
        +'<button class="inv" data-appr="'+esc(String(id))+'">Approve, mint the code</button>'
        +'<button class="dngr" data-rrej="'+esc(String(id))+'">Reject</button>'
        +'<button class="cmail" data-rnote="'+esc(String(id))+'">Add note</button></div>';
    }else{
      h+='<div style="margin-top:8px"><button class="cmail" data-rnote="'+esc(String(id))+'">Add note</button></div>';
    }
    h+="</div>";
  });
  h+=footLine();
  m.innerHTML=h;
  m.querySelectorAll("[data-rtab]").forEach(function(b){
    b.addEventListener("click", function(){ RSTATE.tab=this.getAttribute("data-rtab"); secRecruiting(); });
  });
  if(m.querySelector(".rref")){
    getMemberList().then(function(rows){
      m.querySelectorAll(".rref").forEach(function(sel){
        const keep=sel.value;
        let o='<option value="">nobody / unknown</option>';
        (rows||[]).forEach(function(r){
          const mid=accId(r); if(mid==null) return;
          o+='<option value="'+esc(String(mid))+'">'+esc(accName(r))+"</option>";
        });
        sel.innerHTML=o; if(keep) sel.value=keep;
      });
    });
  }
  m.querySelectorAll("[data-appr]").forEach(function(b){
    b.addEventListener("click", function(){
      const btn=this, id=btn.getAttribute("data-appr");
      busy(btn, async function(){
        const body={action:"approve"};
        const sel=document.querySelector('.rref[data-for="'+id+'"]');
        if(sel && sel.value!=="") body.referred_by=Number(sel.value);
        const r=await api("/api/admin/applications/"+encodeURIComponent(id)+"/review", body);
        const code=r.code||"", hand=r.handoff||("Your BONK portal code: "+code);
        let out='<div style="margin:12px 0 6px"><span class="bigcode">'+esc(code)+"</span></div>"
          +'<div class="hand">'+esc(hand)+"</div>"+cpBtn("https://bonkeve.com/portal/claim?code="+code,"Copy link")+" "+cpBtn(code,"Copy code")+" "+cpBtn(hand,"Copy handoff DM");
        const cid=r.code_id!=null?r.code_id:(r.codeId);
        if(cid!=null) out+=' <button class="inv" data-handoff2="'+esc(String(cid))+'">Mark handed off</button>';
        const host=document.getElementById("r_out_"+id);
        if(host){
          host.innerHTML=out;
          const hb=host.querySelector("[data-handoff2]");
          if(hb) hb.addEventListener("click", function(){
            const b2=this;
            busy(b2, async function(){
              await api("/api/admin/codes/action",{code_id:isNaN(Number(cid))?cid:Number(cid), action:"handoff"});
              toast("Marked handed off. Now watch for the redeem.");
            });
          });
        }
        toast("Approved. A new goblin approaches the table.");
      });
    });
  });
  m.querySelectorAll("[data-rrej]").forEach(function(b){
    b.addEventListener("click", function(){
      const btn=this, id=btn.getAttribute("data-rrej");
      busy(btn, async function(){
        const why=prompt("Reason for the reject:"); if(why==null) return;
        await api("/api/admin/applications/"+encodeURIComponent(id)+"/review",{action:"reject", note:why});
        toast("Rejected. Not every rock is ore.");
        secRecruiting();
      });
    });
  });
  m.querySelectorAll("[data-rnote]").forEach(function(b){
    b.addEventListener("click", function(){
      const btn=this, id=btn.getAttribute("data-rnote");
      busy(btn, async function(){
        const n=prompt("Review note:"); if(!n) return;
        await api("/api/admin/applications/"+encodeURIComponent(id)+"/review",{action:"note", note:n});
        toast("Noted.");
        secRecruiting();
      });
    });
  });
}
</script>
<script>

      +'<button class="inv" onclick="secDecorations()">Try again</button>';
    return;
  }
  CATALOG=j.decorations||j.catalog||[];
  const remind=j.reminder||j.message||"When the catalog changes, update the static Wall of Goblins page so the wall and the shelf never drift.";

  h+='<div style="overflow-x:auto"><table><thead><tr><th></th><th>Name</th><th>Key</th><th>Tier</th><th>Grant</th><th>Source</th><th>Threshold</th>'

  if(!CATALOG.length) h+='<tr><td colspan="8"><div class="nap">The wall is bare. That cannot be right.</div></td></tr>';
  CATALOG.forEach(function(d,i){
    h+="<tr>"
      +'<td style="font-size:19px">'+esc(d.emoji||"")+"</td>"
      +'<td class="tl"><b>'+esc(d.name)+"</b>"
      +(d.description?'<div class="rowmeta">'+esc(d.description)+"</div>":"")+"</td>"
      +"<td><code>"+esc(d.key)+"</code></td>"
      +'<td class="num">'+esc(d.tier!=null?d.tier:"")+"</td>"
      +'<td class="kind">'+esc(d.auto?"auto":"manual")+"</td>"
      +'<td class="kind">'+esc(d.data_source||"")+"</td>"
      +'<td class="num">'+(d.threshold!=null?fmtIsk(d.threshold):"")+"</td>"
      +(ISADMIN?'<td><button class="cmail" data-dedit="'+i+'">Edit</button></td>':"")
      +"</tr>";
  });
  h+="</tbody></table></div>";
  if(ISADMIN) h+='<div style="margin-top:14px"><button class="inv" id="dadd">Add a medal</button></div><div id="dform"></div>';
  h+=footLine();
  m.innerHTML=h;
