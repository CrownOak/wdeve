    m.querySelectorAll("[data-dedit]").forEach(function(b){
      b.addEventListener("click", function(){ decForm(CATALOG[Number(this.getAttribute("data-dedit"))]||{}); });

function decForm(d){
  const host=document.getElementById("dform");
  host.innerHTML='<div class="panel" style="margin-top:12px"><div class="ptitle">'+(d.key?"Edit medal":"New medal")+"</div>"
    +'<div class="frm">'
    +'<div><label>Key</label><input id="df_key" value="'+esc(d.key||"")+'"'+(d.key?" readonly":"")+"></div>"

    +'<div><label>Tier (4 or less is High Honors)</label><input id="df_tier" type="number" value="'+esc(d.tier!=null?d.tier:"")+'"></div>'
    +'<div><label>Grant</label><select id="df_auto"><option value="0"'+(!d.auto?" selected":"")+'>manual</option><option value="1"'+(d.auto?" selected":"")+">auto</option></select></div>"

    +'<div><label>Threshold</label><input id="df_thr" type="number" value="'+esc(d.threshold!=null?d.threshold:"")+'"></div>'

  document.getElementById("df_cancel").addEventListener("click", function(){ host.innerHTML=""; });
  document.getElementById("df_save").addEventListener("click", function(){
    const btn=this;
    busy(btn, async function(){
      const g=function(id){ return document.getElementById(id).value.trim(); };
      const body={ key:g("df_key"), name:g("df_name"), emoji:g("df_emoji"),
        description:document.getElementById("df_desc").value,
        auto:document.getElementById("df_auto").value==="1",
        data_source:g("df_src")||null };
      if(!body.key||!body.name){ toast("A medal needs a key and a name.", true); return; }
      const tier=g("df_tier"); if(tier!=="") body.tier=Number(tier);

      await api("/api/admin/decorations", body);

/* ================= 6. RECONCILE ================= */
async function secReconcile(){
  const m=document.getElementById("main");
  m.innerHTML=head("Reconcile","unmatched ledger names &middot; payout credited to nobody until you act")+skel(3);
  let j;
  try{ j=await api("/api/admin/aliases"); }
  catch(e){
    if(e.message===SILENT) return;
    m.innerHTML=head("Reconcile","unmatched ledger names")+napPanel("Reconciliation", e.message)
      +'<button class="inv" onclick="secReconcile()">Try again</button>';
    return;
  }
  const un=j.unmatched||[];
  let h=head("Reconcile","unmatched ledger names &middot; payout credited to nobody until you act");
  if(!un.length){
    h+='<div class="empty">Every ledger name is matched. Clean books.</div>';
  }else{
    un.forEach(function(u,i){
      const cands=u.candidates||u.suggestions||[];
      h+='<div class="ccard"><div class="chead"><b>'+esc(u.ledger_name||u.name)+"</b>"
        +'<span class="qval">'+fmtIsk(u.payout!=null?u.payout:u.isk)+" at stake</span>"
        +'<span class="qmeta">'+fmtN(u.ops!=null?u.ops:u.opDrops)+" ops</span></div>";
      if(cands.length){
        h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center">';
        cands.forEach(function(c){
          h+='<button class="inv" data-rcattach="'+esc(String(u.ledger_name||u.name))+'" data-rccid="'+esc(String(c.character_id!=null?c.character_id:c.id))+'">'
            +"Attach to "+esc(c.ign||c.name)+(c.score!=null?' <span class="qmeta">'+Math.round(Number(c.score)*(Number(c.score)<=1?100:1))+"%</span>":"")+"</button>";
        });
        h+="</div>";
      }else{
        h+='<div class="rowmeta" style="margin-top:6px">No lookalikes found. Attach by hand:</div>';
      }
      h+='<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">'
        +'<input class="rc_manual" data-name="'+esc(String(u.ledger_name||u.name))+'" placeholder="character id" style="max-width:150px">'
        +'<button class="cmail" data-rcman="'+esc(String(u.ledger_name||u.name))+'" data-idx="'+i+'">Attach by id</button></div>'
        +"</div>";
    });
  }
  h+=footLine();
  m.innerHTML=h;
  async function attach(cid, name, btn){
    busy(btn, async function(){
      await api("/api/admin/aliases",{character_id:isNaN(Number(cid))?cid:Number(cid), ledger_name:name});
      toast("Attached. Somebody just got their ISK back.");
      secReconcile();
    });
  }
  m.querySelectorAll("[data-rcattach]").forEach(function(b){
    b.addEventListener("click", function(){ attach(this.getAttribute("data-rccid"), this.getAttribute("data-rcattach"), this); });
  });
  m.querySelectorAll("[data-rcman]").forEach(function(b){
    b.addEventListener("click", function(){
      const name=this.getAttribute("data-rcman");
      const inp=m.querySelector('.rc_manual[data-name="'+CSS.escape(name)+'"]');
      if(!inp || !inp.value.trim()){ toast("Give me a character id first.", true); return; }
      attach(inp.value.trim(), name, this);
    });
  });
}
</script>

          +'<td class="tl">'+(probs.length?'<span class="bad">'+esc(probs.join("; "))+"</span>":'<span class="good">clean</span>')+"</td></tr>";

        +"</div>";

    });
  });
}

async function drawAudit(f){
  const m=document.getElementById("main");
  const qs=[];
  if(f.actor) qs.push("actor="+encodeURIComponent(f.actor));
  if(f.action) qs.push("action="+encodeURIComponent(f.action));
  if(f.account_id) qs.push("account_id="+encodeURIComponent(f.account_id));
  let j;
  try{ j=await api("/api/admin/audit"+(qs.length?"?"+qs.join("&"):"")); }
  catch(e){
    if(e.message===SILENT) return;
    m.innerHTML=head("Audit","every hand that touched the books")+napPanel("Audit trail", e.message)
      +'<button class="inv" onclick="secAudit()">Try again</button>';
    return;
  }
  const rows=j.audit||[];
  let h=head("Audit","every hand that touched the books");
  h+='<div class="filterbar">'
    +'<input type="text" id="au_actor" placeholder="actor" value="'+esc(f.actor||"")+'" style="width:150px">'
    +'<input type="text" id="au_action" placeholder="action" value="'+esc(f.action||"")+'" style="width:150px">'
    +'<input type="text" id="au_acct" placeholder="account id" value="'+esc(f.account_id||"")+'" style="width:120px">'
    +'<button class="inv" id="au_go">Filter</button></div>';
  h+='<div style="overflow-x:auto"><table><thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Target</th><th>Detail</th></tr></thead><tbody>';
  if(!rows.length) h+='<tr><td colspan="5"><div class="nap">Nothing logged for that filter. Clean hands or wrong net.</div></td></tr>';
  rows.forEach(function(r){
    let det=r.detail;
    if(det && typeof det==="string"){ try{ det=JSON.stringify(JSON.parse(det), null, 1); }catch(e){} }
    else if(det && typeof det==="object"){ det=JSON.stringify(det, null, 1); }
    h+='<tr><td class="when">'+esc(ago(r.created_at||r.when))+"</td>"
      +'<td class="tl">'+esc(r.actor||r.actor_ign||"")+"</td>"
      +"<td><code>"+esc(r.action||"")+"</code></td>"
      +'<td class="tl">'+esc(r.target||r.target_ign||(r.account_id!=null?("account "+r.account_id):""))+"</td>"
      +'<td class="tl">'+(det?'<pre class="jsonp">'+esc(det)+"</pre>":"")+"</td></tr>";
  });
  h+="</tbody></table></div>"+footLine();
  m.innerHTML=h;
  document.getElementById("au_go").addEventListener("click", function(){
    drawAudit({ actor:document.getElementById("au_actor").value.trim(),
      action:document.getElementById("au_action").value.trim(),
      account_id:document.getElementById("au_acct").value.trim() });
  });
}

function evPad(n){ return (n<10?"0":"")+n; }
function evLocal(d){
  return d.getUTCFullYear()+"-"+evPad(d.getUTCMonth()+1)+"-"+evPad(d.getUTCDate())
    +"T"+evPad(d.getUTCHours())+":"+evPad(d.getUTCMinutes());
}
function evIso(v){ return (v.length===16 ? v+":00" : v)+"Z"; }
function evWindow(preset){
  const now=new Date();
  const mon=new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()-((now.getUTCDay()+6)%7)));
  if(preset==="this_week") return [mon, new Date(mon.getTime()+7*86400000)];
  if(preset==="next_week"){ const nm=new Date(mon.getTime()+7*86400000); return [nm, new Date(nm.getTime()+7*86400000)]; }
  if(preset==="this_month") return [new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1)),
    new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth()+1, 1))];
  return null;
}
function evMetricLabel(ev){
  if(ev.metric==="ore") return "One ore &middot; "+esc(ev.ore_base||"?");
  return {all_ore:"All ore", ice:"Ice", isk:"ISK", m3:"m³", ops:"Ops"}[ev.metric]||esc(ev.metric||"?");
}
function evValue(ev, v){
  if(ev.metric==="isk") return fmtIsk(v);
  if(ev.metric==="m3") return fmtM3(v)||"0 m³";
  if(ev.metric==="ops") return fmtN(v);
  return fmtN(v)+" units";
}
function evDecoName(key){
  let d=null;
  (CATALOG||[]).forEach(function(x){ if(x.key===key) d=x; });
  return d?esc((d.emoji||"")+" "+d.name):esc(key);
}

/* ================= THE BOOKS =================
   Where the ISK comes from, in one screen. Officer gated at the API, so a member
   who guesses the hash still gets a 403 and not a margin.

   The three sources are NEVER added together, because they measure different things
   and two of them overlap:
     THE SPREAD  = every rock our goblins pulled (their own ESI mining ledgers).
                   ADDRESSABLE, not booked: a goblin who mines and hauls to Jita
                   himself is counted here too. It answers "what is the buyback worth
                   if all of it comes through us".
     THROUGH THE OPS = what actually came through a corp op and got paid out. REALIZED,
                   and a subset of the above. Rolling cache, not lifetime.
     THE WORKS   = the factory P&L. MODELED forward at hub capped rates.
   Adding the first two would count the same ore twice, so they get separate panels
   and separate words. */
const BKC={ buyback:"rgba(70,255,94,.5)", nocx:"rgba(255,196,74,.55)",
            friction:"rgba(165,175,185,.40)", fixed:"rgba(165,175,185,.20)" };
function bkSeg(w, color, title){
  if(!(w>0)) return "";
  return '<i style="width:'+w.toFixed(2)+'%;background:'+color+'" title="'+esc(title)+'"></i>';
}
function bkKey(color, label){
  return '<span><b style="background:'+color+'"></b>'+esc(label)+"</span>";
}
/* One scenario of the works P&L as a single revenue bar plus its verdict line. */
function bkWorks(sc){
  if(!sc) return "";
  const rev=Number(sc.revenue_day)||0;
  const profit=Number(sc.profit_day)||0;
  /* Scale the bar to whichever side is LONGER. Dividing by revenue looks right only while
     the lines make money: a losing scenario has costs over 100% of revenue, the segments
     overflow, and overflow:hidden silently crops the fixed costs so the bar UNDERSTATES the
     loss. Normalising to max(revenue, costs) keeps every segment truthful and lets a dashed
     marker show where the income actually ran out. */
  const costs=(Number(sc.buyback_out)||0)+(Number(sc.nocxium_cost)||0)
             +(Number(sc.friction)||0)+(Number(sc.fixed_day)||0);
  const denom=Math.max(rev,costs)||1;
  const short=costs>rev;
  const pct=function(v){ return 100*(Number(v)||0)/denom; };
  let h='<div class="ptitle">'+esc(sc.label||"scenario")
    +'<span class="pn">'+fmtN(sc.lines)+" lines &middot; "+fmtIsk(rev)+" revenue a day</span></div>";
  h+='<div class="bkbar">'
    + bkSeg(pct(sc.buyback_out), BKC.buyback, "buyback to our own miners")
    + bkSeg(pct(sc.nocxium_cost), BKC.nocx, "nocxium bought off the market")
    + bkSeg(pct(sc.friction), BKC.friction, "sales tax and broker")
    + bkSeg(pct(sc.fixed_day), BKC.fixed, "fuel and freight")
    + bkSeg(Math.max(0,pct(profit)), "var(--ore)", "corp profit")
    + (short ? '<u style="left:'+(100*rev/denom).toFixed(2)+'%" title="revenue ends here"></u>' : "")
    + "</div>";
  h+='<div class="bkkey">'
    + bkKey(BKC.buyback,"buyback "+fmtIsk(sc.buyback_out))
    + (Number(sc.nocxium_cost)>0 ? bkKey(BKC.nocx,"nocxium "+fmtIsk(sc.nocxium_cost)) : "")
    + bkKey(BKC.friction,"tax + broker "+fmtIsk(sc.friction))
    + bkKey(BKC.fixed,"fuel + freight "+fmtIsk(sc.fixed_day))
    + (profit>=0 ? bkKey("var(--ore)","profit "+fmtIsk(profit)) : "")
    + (short ? '<span><b style="background:transparent;border-left:2px dashed var(--amber);width:2px"></b>revenue ends here</span>' : "")
    + "</div>";
  if(profit>=0){
    h+='<div class="bkline">Keeps <em>'+fmtIsk(profit)+" a day</em> at "+sig(Math.abs(Number(sc.margin_pct)||0))
      +"% of revenue, and puts <em>"+fmtIsk(sc.buyback_out)+"</em> a day into goblin wallets on the way. "
      +"The ecosystem moves <em>"+fmtIsk(sc.ecosystem_day)+"</em> a day.</div>";
  }else{
    h+='<div class="bkline warnline">Loses <em>'+fmtIsk(Math.abs(profit))+" a day</em>. "
      +"Fuel and freight are <em>"+fmtIsk(sc.fixed_day)+"</em> whether the lines run or not, "
      +"and "+fmtIsk(sc.revenue_day)+" of revenue cannot carry them. "
      +"This is a scale problem, not a margin problem.</div>";
  }
  h+='<div class="bkline">Feeding it costs <em>'+fmtN(sc.m3_day)+" m³ a day</em>, about "
    +sig(Number(sc.fleet_nights_week)||0)+" Orca fleet nights a week.</div>";
  return h;
}

  h+='<div class="pulse">';
  h+=tile("Rock pulled, 30d", d30?fmtIsk(d30.gross):"…", d30?"":"dim");
  h+=tile("We would pay", d30?fmtIsk(d30.payout):"…", d30?"":"dim");
  h+=tile("The spread, 30d", d30?fmtIsk(d30.take):"…", d30?"":"dim");
  h+=tile("Our cut of the rock", d30&&d30.take_pct!=null?sig(d30.take_pct)+"%":"…", d30?"":"dim");
  h+=tile("Paid out on ops, 30d", fleet?fmtIsk(fleet.d30.payout):"napping", fleet?"":"dim");
  h+=tile("Works profit, a day", full?fmtIsk(full.profit_day):"no run", full?(Number(full.profit_day)<0?"warn":""):"dim");
  h+=tile("Station fund", fund.target?fmtIsk(fund.raised):"off", fund.target?"":"dim");
  h+=tile("Industry counted", fmtIsk(ind.counted_isk));
  h+="</div>";

  /* the spread */
  if(!flow){
    h+=napPanel("The spread","No price data, so the rock cannot be valued. The refinery blob is unreachable.");
  }else{
    h+='<div class="panel"><div class="ptitle">The spread'
      +'<span class="pn">every rock our goblins pulled, priced today at basis '
      +sig(basis.empire!=null?basis.empire:0)+"</span></div>";
    h+='<table class="bktab"><thead><tr><th>Month</th><th>Goblins</th><th>Rock value</th>'
      +"<th>We pay</th><th>We keep</th><th>Our cut</th></tr></thead><tbody>";
    (flow.months||[]).forEach(function(r){
      h+="<tr><td>"+esc(r.mo)+"</td><td>"+fmtN(r.miners)+"</td><td>"+fmtIsk(r.gross)+"</td>"
        +"<td>"+fmtIsk(r.payout)+'</td><td class="keep">'+fmtIsk(r.take)+"</td><td>"
        +(r.take_pct!=null?sig(r.take_pct)+"%":"&mdash;")+"</td></tr>";
    });
    h+="</tbody></table>";
    const first=(flow.months||[])[0], last=(flow.months||[])[(flow.months||[]).length-1];
    if(first && last && first!==last){
      h+='<div class="bkline">'+esc(first.mo)+" was <em>"+fmtIsk(first.gross)+"</em> of rock from "
        +fmtN(first.miners)+" goblins. "+esc(last.mo)+" is <em>"+fmtIsk(last.gross)+"</em> from "
        +fmtN(last.miners)+".</div>";
    }
    h+='<div class="bkcaveat">This is what our goblins pulled out of the ground, not what we bought. '
      +"A goblin who mines and hauls to Jita himself is in this table too, so read it as the size of the "
      +"prize and not as income. We keep "+(d30&&d30.take_pct!=null?sig(d30.take_pct):"?")+"% because we pay "
      +sig((basis.empire||0)*bb*100)+"% of a perfect refine and recover "+sig(rec*100)+"%. "
      +"The months are all priced at TODAY's basis on purpose: the stored value of the older rows was "
      +"written at the basis of the day, and adding those would make a basis change look like goblins mining harder."
      +(flow.all&&flow.all.unmatched_types?" "+fmtN(flow.all.unmatched_types)+" ore types could not be priced and are left out rather than counted as zero.":"")
      +(flow.prices_stale?" ⚠ Prices are stale, served from the last good pull.":"")
      +"</div></div>";
  }

  /* realized + the pot, side by side */
  h+='<div class="bkgrid">';
  h+='<div class="panel"><div class="ptitle">Through the ops<span class="pn">what we actually bought</span></div>';
  if(!fleet){
    h+='<div class="nap">The fleet ledger is napping. Numbers back soon.</div>';
  }else{
    const fwd = (basis.empire&&bb) ? rec/(basis.empire*bb) : null;
    h+='<div class="bkline">Paid out <em>'+fmtIsk(fleet.d30.payout)+"</em> across "+fmtN(fleet.d30.ops)
      +" ops in 30 days, for "+fmtN(fleet.d30.m3)+" m³ of rock.</div>";
    if(fwd){
      h+='<div class="bkline">At today\'s basis every <em>1B</em> we pay out comes back as <em>'
        +sig(fwd)+"B</em> of minerals, so that haul is worth about <em>"
        +fmtIsk(fleet.d30.payout*(fwd-1))+"</em> to the corp.</div>";
    }
    h+='<div class="bkcaveat">Forward rate, not history: these ops were paid at the basis in force on the '
      +"night they ran. The archive holds the "+fmtN(fleet.cached_ops)
      +" newest ops only, so this is a window and never a lifetime total.</div>";
  }
  h+="</div>";

  h+='<div class="panel"><div class="ptitle">The pot<span class="pn">ISK an officer confirmed against the wallet</span></div>';
  if(fund.target){
    const pc=Math.max(0,Math.min(100,Number(fund.pct)||0));
    h+='<div style="display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;font-family:var(--mono)">'
      +'<span style="font-size:20px;color:var(--ore);font-variant-numeric:tabular-nums">'+fmtIsk(fund.raised)+"</span>"
      +'<span class="qmeta">of '+fmtIsk(fund.target)+" for "+esc(fund.name||"the structure")+"</span>"
      +'<span class="qmeta" style="margin-left:auto">'+pc+"%</span></div>"
      +'<div class="prog" style="margin-top:8px"><i style="width:'+pc+'%"></i></div>';
    if(Number(fund.raised)>Number(fund.target)){
      h+='<div class="bkline">Over target by <em>'+fmtIsk(Number(fund.raised)-Number(fund.target))
        +"</em> across "+fmtN(fund.contributions)+" contributions. Pick the next structure.</div>";
    }else{
      h+='<div class="bkline">'+fmtN(fund.contributions)+" contributions in. <em>"
        +fmtIsk(Number(fund.target)-Number(fund.raised))+"</em> to go.</div>";
    }
    if(Number(fund.pending_n)>0){
      h+='<div class="bkline warnline"><em>'+fmtN(fund.pending_n)+" waiting on you</em> to confirm, worth "
        +fmtIsk(fund.pending_isk)+".</div>";
    }
  }else{
    h+='<div class="nap">No campaign running. Start one in Settings.</div>';
  }
  h+='<div class="bkline">Industry contributions counted: <em>'+fmtIsk(ind.counted_isk)+"</em> over "
    +fmtN(ind.counted_n)+" jobs."+(Number(ind.pending_n)>0?" "+fmtN(ind.pending_n)+" pending review.":"")+"</div>";
  h+="</div></div>";

  /* the works */
  if(!works){
    h+=napPanel("The works","No run yet. The works-econ generator writes this daily.");
  }else{
    const stale=Number(j.works_stale_days);
    h+='<div class="panel"><div class="ptitle">The works'
      +'<span class="pn">modeled forward at hub capped rates &middot; '
      +(isFinite(stale)?(stale<=0?"computed today":stale+" days old"):"age unknown")+"</span></div>";
    if(isFinite(stale) && stale>=3){
      h+='<div class="bkline warnline">⚠ <em>'+stale+" days old.</em> The daily generator may not be firing.</div>";
    }
    h+=bkWorks(works.full);
    if(works.phase1){ h+='<div style="margin-top:18px">'+bkWorks(works.phase1)+"</div>"; }
    h+='<div class="bkcaveat">Modeled, not booked: this is what a day of production would pay if every line '
      +"ran at the rate the hub can absorb. The buyback line inside it is the same ISK the spread panel "
      +"counts, seen from the factory side, so do not add the two.</div></div>";
  }
  h+=footLine();
  m.innerHTML=h;
}
/* ================= registry + boot ================= */

/* ================= SUGGESTIONS QUEUE =================
   The box is genuinely anonymous: the table has no author column, so there is
   nothing here to reveal and nothing to be tempted by. Officers get the queue and
   the controls, and a reply written here is shown to every member next to the
   suggestion, which is the whole point of having a queue rather than an inbox. */
function sugStatusChip(st){
  const c={open:"sgOpen",noted:"sgNoted",done:"sgDone",declined:"sgDecl"}[st]||"sgOpen";
  return '<span class="sgchip '+c+'">'+esc(st)+'</span>';
}
async function secSuggestions(){
  const m=document.getElementById("main");
  m.innerHTML=head("Suggestions","what the corp is telling you, with nobody's name on it")+skel(3);
  let d=null;
  try{ d=await api("admin/suggestions"); }catch(e){ m.innerHTML=head("Suggestions","")+napPanel("Suggestions","Could not read the queue."); return; }
  const rows=(d&&d.suggestions)||[];
  let h=head("Suggestions", (d&&d.open?d.open:0)+" open of "+rows.length);
  h+='<div class="panel"><div class="nap" style="margin:0">'
    +'These are anonymous by construction. The suggestions table has no author column, '
    +'so nobody, including you, can look up who wrote one. A member only has a name here '
    +'if they chose to sign it. Whatever you write in Reply is shown to every member.'
    +'</div></div>';
  if(!rows.length){ h+=napPanel("Nothing yet","The box is empty. That is not the same as everyone being happy."); m.innerHTML=h+footLine(); return; }
  h+='<div class="panel"><div class="ptitle">The queue</div>';
  rows.forEach(function(r){
    h+='<div class="sgrow" id="sgrow'+r.id+'">'
      +'<div class="sgtop">'+sugStatusChip(r.status)
      +'<span class="sgwho">'+(r.signed_name?esc(r.signed_name):'anonymous')+'</span>'
      +'<span class="sgat">'+esc(String(r.created_at).replace("T"," ").slice(0,16))+'</span></div>'
      +'<div class="sgbody">'+esc(r.body)+'</div>'
      +(r.reply?'<div class="sgreply">'+esc(r.reply)+'</div>':'')
      +(r.updated_by?'<div class="sgby">handled by '+esc(r.updated_by)+'</div>':'')
      +'<div class="sgacts">'
      +'<input class="sgrep" id="sgrep'+r.id+'" placeholder="reply, shown to everyone" value="'+esc(r.reply||"")+'" maxlength="600">'
      +'<select class="sgsel" id="sgsel'+r.id+'">'
      + ["open","noted","done","declined"].map(function(x){ return '<option value="'+x+'"'+(r.status===x?' selected':'')+'>'+x+'</option>'; }).join("")
      +'</select>'
      +'<button class="gobtn sgsave" data-id="'+r.id+'">Save</button>'
      +'</div></div>';
  });
  h+='</div>';
  m.innerHTML=h+footLine();
  m.querySelectorAll(".sgsave").forEach(function(b){
    b.addEventListener("click",async function(){
      const id=b.getAttribute("data-id");
      b.disabled=true; b.textContent="saving";
      try{
        await api("admin/suggestion",{method:"POST",body:JSON.stringify({
          id:+id,
          status:document.getElementById("sgsel"+id).value,
          reply:document.getElementById("sgrep"+id).value
        })});
        toast("Saved");
        secSuggestions();
      }catch(e){ b.disabled=false; b.textContent="Save"; toast("Did not save"); }
    });
  });
}

const SECTIONS={ "":secOverview, suggestions:secSuggestions, books:secBooks, members:secMembers, contracts:secContracts,
  industry:secIndustry, recruiting:secRecruiting, events:secEvents,
  decorations:secDecorations, reconcile:secReconcile,
  backfill:secBackfill, audit:secAudit, settings:secSettings };
boot();
</script>
